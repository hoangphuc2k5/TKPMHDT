<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - Drink Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header id="app-header"></header>

    <div class="container my-5">
        <h2 class="fw-bold mb-5">🛒 Giỏ hàng của bạn</h2>
        
        <div class="row">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 20px;">
                    <div id="cart-items" class="table-responsive">
                        <!-- Items will be loaded here -->
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-sm p-4" style="border-radius: 20px;">
                    <h5 class="fw-bold mb-4">Tóm tắt đơn hàng</h5>
                    
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Tổng tiền hàng:</span>
                        <span id="subtotal" class="fw-bold">0đ</span>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Mã giảm giá</label>
                        <div class="input-group">
                            <input type="text" id="coupon-code" class="form-control" placeholder="Nhập mã...">
                            <button id="apply-coupon" class="btn btn-outline-primary">Áp dụng</button>
                        </div>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between mb-4">
                        <span class="fs-5 fw-bold">Tổng cộng:</span>
                        <span id="total" class="fs-4 fw-bold text-orange">0đ</span>
                    </div>

                    <a href="/checkout.html" class="btn btn-primary w-100 btn-lg">Tiến hành đặt hàng</a>
                </div>
            </div>
        </div>
    </div>

    <footer id="app-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/app/pages/cart.js"></script>
</body>
</html>
