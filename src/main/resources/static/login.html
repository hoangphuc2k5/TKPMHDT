<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Drink Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card border-0 shadow-medium p-5" style="border-radius: 30px; width: 450px;">
            <div class="text-center mb-5">
                <a href="/" class="navbar-brand mb-4 d-block">DRINK<span style="color: var(--primary-blue);">STORE</span></a>
                <h4 class="fw-bold">Chào mừng trở lại!</h4>
                <p class="text-muted">Vui lòng đăng nhập để tiếp tục</p>
            </div>
            
            <form id="login-form">
                <div class="mb-4">
                    <label class="form-label fw-bold">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-control form-control-lg" placeholder="Nhập tên đăng nhập" required>
                </div>
                <div class="mb-5">
                    <label class="form-label fw-bold">Mật khẩu</label>
                    <input type="password" id="password" class="form-control form-control-lg" placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg mb-4">Đăng nhập</button>
            </form>
            
            <p class="text-center mb-0">Bạn chưa có tài khoản? <a href="/register.html" class="text-primary text-decoration-none fw-bold">Đăng ký ngay</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/app/pages/login.js"></script>
</body>
</html>
