<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Drink Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar d-none d-lg-block" style="width: 280px; position: fixed;">
            <a class="navbar-brand mb-5 d-block text-center" href="/">DRINK<span style="color: var(--primary-blue);">STORE</span></a>
            
            <nav class="nav flex-column">
                <a class="sidebar-link active" href="/admin/index.html">📊 Dashboard</a>
                <a class="sidebar-link" href="/admin/products.html">🥤 Quản lý sản phẩm</a>
                <a class="sidebar-link" href="/admin/orders.html">📦 Quản lý đơn hàng</a>
                <a class="sidebar-link" href="/admin/users.html">👥 Quản lý người dùng</a>
                <a class="sidebar-link" href="/admin/coupons.html">🎟️ Quản lý khuyến mãi</a>
                <a class="sidebar-link text-danger mt-5" href="#" onclick="auth.logout()">🚪 Đăng xuất</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1 p-4" style="margin-left: 280px;">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <h2 class="fw-bold mb-0">📊 Báo cáo & Thống kê</h2>
                <div class="dropdown">
                    <button class="btn btn-white shadow-sm dropdown-toggle" type="button" id="adminDropdown" data-bs-toggle="dropdown">
                        Chào Admin
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#" onclick="auth.logout()">Đăng xuất</a></li>
                    </ul>
                </div>
            </div>

            <!-- Stats Cards -->
            <div id="stats-container" class="row mb-5">
                <div class="col-md-4 mb-4">
                    <div class="card border-0 shadow-sm p-4 text-center" style="border-radius: 20px;">
                        <h6 class="text-muted mb-2">Người dùng hệ thống</h6>
                        <h2 id="total-users" class="fw-bold mb-0">...</h2>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card border-0 shadow-sm p-4 text-center" style="border-radius: 20px;">
                        <h6 class="text-muted mb-2">Sản phẩm hiện có</h6>
                        <h2 id="total-products" class="fw-bold mb-0">...</h2>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card border-0 shadow-sm p-4 text-center" style="border-radius: 20px;">
                        <h6 class="text-muted mb-2">Tổng đơn hàng</h6>
                        <h2 id="total-orders" class="fw-bold mb-0">...</h2>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="row">
                <div class="col-lg-8 mb-4">
                    <div class="card border-0 shadow-sm p-4" style="border-radius: 20px;">
                        <h5 class="fw-bold mb-4">Doanh thu theo ngày</h5>
                        <canvas id="revenueChart" height="300"></canvas>
                    </div>
                </div>
                <div class="col-lg-4 mb-4">
                    <div class="card border-0 shadow-sm p-4" style="border-radius: 20px;">
                        <h5 class="fw-bold mb-4">Hoạt động gần đây</h5>
                        <div id="recent-activities" class="small">
                            <!-- Activities will be loaded here -->
                            <p class="text-muted">Đang tải...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!checkAccess('ADMIN')) return;

            // Load Stats
            try {
                const stats = await apiFetch('/admin/stats');
                document.getElementById('total-users').innerText = stats.totalUsers;
                document.getElementById('total-products').innerText = stats.totalProducts;
                document.getElementById('total-orders').innerText = stats.totalOrders;
            } catch (error) {
                ui.showToast(error.message, 'danger');
            }

            // Load Revenue Report
            try {
                const revenueData = await apiFetch('/admin/reports/revenue');
                const labels = revenueData.map(item => item.label);
                const values = revenueData.map(item => item.value);

                const ctx = document.getElementById('revenueChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Doanh thu (VNĐ)',
                            data: values,
                            borderColor: '#2196F3',
                            backgroundColor: 'rgba(33, 150, 243, 0.1)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            } catch (error) {
                console.error('Error loading chart:', error);
            }
        });
    </script>
</body>
</html>
