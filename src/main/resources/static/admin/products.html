<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản lý sản phẩm</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="d-flex">
    <div class="sidebar d-none d-lg-block" style="width: 280px; position: fixed;">
        <a class="navbar-brand mb-5 d-block text-center" href="/">DRINK<span style="color: var(--primary-blue);">STORE</span></a>
        <nav class="nav flex-column">
            <a class="sidebar-link" href="/admin/index.html">📊 Dashboard</a>
            <a class="sidebar-link active" href="/admin/products.html">🥤 Quản lý sản phẩm</a>
            <a class="sidebar-link" href="/admin/orders.html">📦 Quản lý đơn hàng</a>
            <a class="sidebar-link" href="/admin/users.html">👥 Quản lý người dùng</a>
            <a class="sidebar-link" href="/admin/coupons.html">🎟️ Quản lý khuyến mãi</a>
            <a class="sidebar-link text-danger mt-5" href="#" onclick="auth.logout()">🚪 Đăng xuất</a>
        </nav>
    </div>

    <div class="flex-grow-1 p-4" style="margin-left: 280px;">
        <h2 class="fw-bold mb-4">🥤 Quản lý sản phẩm & nguyên liệu</h2>
        <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 20px;">
            <form id="product-form" class="row g-3">
                <input type="hidden" id="product-id">
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Loại</label>
                    <select id="product-type" class="form-select">
                        <option value="NUOC_UONG_SAN">Nước uống sẵn</option>
                        <option value="NGUYEN_LIEU">Nguyên liệu</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Tên</label>
                    <input id="product-name" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Giá</label>
                    <input id="product-price" type="number" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Mô tả</label>
                    <input id="product-desc" class="form-control">
                </div>
                <div class="col-md-3 product-drink-field">
                    <label class="form-label fw-semibold">Dung tích</label>
                    <input id="product-volume" class="form-control" value="500ml">
                </div>
                <div class="col-md-3 product-drink-field">
                    <label class="form-label fw-semibold">Loại nước</label>
                    <input id="product-drink-type" class="form-control" value="Trà sữa">
                </div>
                <div class="col-md-2 product-ingredient-field d-none">
                    <label class="form-label fw-semibold">Tồn kho</label>
                    <input id="ingredient-stock" type="number" step="0.1" class="form-control" value="0">
                </div>
                <div class="col-md-2 product-ingredient-field d-none">
                    <label class="form-label fw-semibold">Ngưỡng cảnh báo</label>
                    <input id="ingredient-threshold" type="number" step="0.1" class="form-control" value="0">
                </div>
                <div class="col-md-2 product-ingredient-field d-none">
                    <label class="form-label fw-semibold">Đơn vị</label>
                    <input id="ingredient-unit" class="form-control" value="kg">
                </div>
                <div class="col-md-12 d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Lưu sản phẩm</button>
                    <button class="btn btn-outline-secondary" type="button" id="reset-form">Nhập mới</button>
                </div>
            </form>
        </div>
        <div class="card border-0 shadow-sm p-4" style="border-radius: 20px;">
            <div id="products-table"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAccess('ADMIN')) return;
        const table = document.getElementById('products-table');
        const form = document.getElementById('product-form');
        const typeSelect = document.getElementById('product-type');
        let productCache = [];

        function toggleTypeFields() {
            const isIngredient = typeSelect.value === 'NGUYEN_LIEU';
            document.querySelectorAll('.product-drink-field').forEach(el => el.classList.toggle('d-none', isIngredient));
            document.querySelectorAll('.product-ingredient-field').forEach(el => el.classList.toggle('d-none', !isIngredient));
        }

        function resetForm() {
            form.reset();
            document.getElementById('product-id').value = '';
            typeSelect.value = 'NUOC_UONG_SAN';
            toggleTypeFields();
        }

        async function loadProducts() {
            const products = await apiFetch('/admin/products');
            productCache = products;
            if (!products.length) {
                table.innerHTML = '<p class="text-muted mb-0">Chưa có sản phẩm.</p>';
                return;
            }
            table.innerHTML = `
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead><tr><th>Tên</th><th>Loại</th><th>Giá</th><th>Mô tả</th><th></th></tr></thead>
                        <tbody>
                            ${products.map(p => `
                                <tr>
                                    <td class="fw-semibold">${p.ten}</td>
                                    <td>${p.loaiSanPham || 'N/A'}</td>
                                    <td>${ui.formatCurrency(p.gia)}</td>
                                    <td>${p.moTa || ''}</td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-outline-primary me-1" onclick='editProduct(${p.id})'>Sửa</button>
                                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id})">Xóa</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>`;
        }

        window.editProduct = (id) => {
            const p = productCache.find(x => x.id === id);
            if (!p) return;
            document.getElementById('product-id').value = p.id;
            document.getElementById('product-type').value = p.loaiSanPham || 'NUOC_UONG_SAN';
            document.getElementById('product-name').value = p.ten || '';
            document.getElementById('product-price').value = p.gia || 0;
            document.getElementById('product-desc').value = p.moTa || '';
            document.getElementById('product-volume').value = p.dungTich || '500ml';
            document.getElementById('product-drink-type').value = p.loaiNuoc || '';
            toggleTypeFields();
        };

        window.deleteProduct = async (id) => {
            if (!confirm('Xóa sản phẩm này?')) return;
            await apiFetch(`/admin/products/${id}`, { method: 'DELETE' });
            ui.showToast('Đã xóa sản phẩm');
            loadProducts();
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const payload = {
                loaiSanPham: document.getElementById('product-type').value,
                ten: document.getElementById('product-name').value,
                gia: parseFloat(document.getElementById('product-price').value || '0'),
                moTa: document.getElementById('product-desc').value,
                dungTich: document.getElementById('product-volume').value,
                loaiNuoc: document.getElementById('product-drink-type').value,
                soLuongTon: parseFloat(document.getElementById('ingredient-stock').value || '0'),
                nguongCanhBao: parseFloat(document.getElementById('ingredient-threshold').value || '0'),
                donViTinh: document.getElementById('ingredient-unit').value
            };
            if (id) await apiFetch(`/admin/products/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
            else await apiFetch('/admin/products', { method: 'POST', body: JSON.stringify(payload) });
            ui.showToast('Lưu sản phẩm thành công');
            resetForm();
            loadProducts();
        });

        document.getElementById('reset-form').addEventListener('click', resetForm);
        typeSelect.addEventListener('change', toggleTypeFields);
        toggleTypeFields();
        await loadProducts();
    });
</script>
</body>
</html>
