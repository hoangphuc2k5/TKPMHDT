<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản lý người dùng</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="d-flex">
    <div class="sidebar d-none d-lg-block" style="width: 280px; position: fixed;">
        <a class="navbar-brand mb-5 d-block text-center" href="/">DRINK<span style="color: var(--primary-blue);">STORE</span></a>
        <nav class="nav flex-column">
            <a class="sidebar-link" href="/admin/index.html">📊 Dashboard</a>
            <a class="sidebar-link" href="/admin/products.html">🥤 Quản lý sản phẩm</a>
            <a class="sidebar-link" href="/admin/orders.html">📦 Quản lý đơn hàng</a>
            <a class="sidebar-link active" href="/admin/users.html">👥 Quản lý người dùng</a>
            <a class="sidebar-link" href="/admin/coupons.html">🎟️ Quản lý khuyến mãi</a>
            <a class="sidebar-link text-danger mt-5" href="#" onclick="auth.logout()">🚪 Đăng xuất</a>
        </nav>
    </div>

    <div class="flex-grow-1 p-4" style="margin-left: 280px;">
        <h2 class="fw-bold mb-4">👥 Quản lý người dùng</h2>
        <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 20px;">
            <form id="user-form" class="row g-3">
                <input type="hidden" id="user-id">
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Vai trò</label>
                    <select id="user-role" class="form-select">
                        <option value="KHACH_HANG">Khách hàng</option>
                        <option value="NHAN_VIEN_BAN_HANG">Nhân viên bán hàng</option>
                        <option value="QUAN_LY_KHO">Quản lý kho</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <div class="col-md-2"><label class="form-label fw-semibold">Username</label><input id="user-username" class="form-control" required></div>
                <div class="col-md-2"><label class="form-label fw-semibold">Mật khẩu</label><input id="user-password" class="form-control" placeholder="Bỏ trống nếu không đổi"></div>
                <div class="col-md-3"><label class="form-label fw-semibold">Họ tên</label><input id="user-name" class="form-control"></div>
                <div class="col-md-3"><label class="form-label fw-semibold">Email</label><input id="user-email" class="form-control"></div>
                <div class="col-md-3"><label class="form-label fw-semibold">Số điện thoại</label><input id="user-phone" class="form-control"></div>
                <div class="col-md-3"><label class="form-label fw-semibold">Địa chỉ</label><input id="user-address" class="form-control"></div>
                <div class="col-md-2"><label class="form-label fw-semibold">Lương (nhân viên)</label><input id="user-salary" type="number" class="form-control" value="0"></div>
                <div class="col-md-4 d-flex align-items-end gap-2">
                    <button class="btn btn-primary" type="submit">Lưu người dùng</button>
                    <button class="btn btn-outline-secondary" type="button" id="reset-user-form">Nhập mới</button>
                </div>
            </form>
        </div>
        <div class="card border-0 shadow-sm p-4" style="border-radius: 20px;">
            <div id="users-table"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAccess('ADMIN')) return;
        const form = document.getElementById('user-form');
        const table = document.getElementById('users-table');
        const role = document.getElementById('user-role');
        const username = document.getElementById('user-username');
        let userCache = [];

        function resetForm() {
            form.reset();
            document.getElementById('user-id').value = '';
            username.disabled = false;
            role.disabled = false;
        }

        async function loadUsers() {
            const users = await apiFetch('/admin/users');
            userCache = users;
            table.innerHTML = `
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead><tr><th>Username</th><th>Họ tên</th><th>Vai trò</th><th>Email</th><th></th></tr></thead>
                        <tbody>
                            ${users.map(u => `
                                <tr>
                                    <td class="fw-semibold">${u.tenDangNhap}</td>
                                    <td>${u.hoTen || ''}</td>
                                    <td>${u.vaiTro}</td>
                                    <td>${u.email || ''}</td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-outline-primary me-1" onclick='editUser(${u.id})'>Sửa</button>
                                        <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${u.id})">Xóa</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.editUser = (id) => {
            const u = userCache.find(x => x.id === id);
            if (!u) return;
            document.getElementById('user-id').value = u.id;
            role.value = u.vaiTro;
            username.value = u.tenDangNhap;
            document.getElementById('user-name').value = u.hoTen || '';
            document.getElementById('user-email').value = u.email || '';
            username.disabled = true;
            role.disabled = true;
        };

        window.deleteUser = async (id) => {
            if (!confirm('Xóa người dùng này?')) return;
            await apiFetch(`/admin/users/${id}`, { method: 'DELETE' });
            ui.showToast('Đã xóa người dùng');
            loadUsers();
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('user-id').value;
            const payload = {
                vaiTro: role.value,
                tenDangNhap: username.value,
                matKhau: document.getElementById('user-password').value,
                hoTen: document.getElementById('user-name').value,
                email: document.getElementById('user-email').value,
                soDienThoai: document.getElementById('user-phone').value,
                diaChi: document.getElementById('user-address').value,
                luong: parseFloat(document.getElementById('user-salary').value || '0')
            };
            if (id) await apiFetch(`/admin/users/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
            else await apiFetch('/admin/users', { method: 'POST', body: JSON.stringify(payload) });
            ui.showToast('Lưu người dùng thành công');
            resetForm();
            loadUsers();
        });

        document.getElementById('reset-user-form').addEventListener('click', resetForm);
        await loadUsers();
    });
</script>
</body>
</html>
