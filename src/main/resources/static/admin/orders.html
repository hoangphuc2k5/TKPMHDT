<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản lý đơn hàng</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="d-flex">
    <div class="sidebar d-none d-lg-block" style="width: 280px; position: fixed;">
        <a class="navbar-brand mb-5 d-block text-center" href="/">DRINK<span style="color: var(--primary-blue);">STORE</span></a>
        <nav class="nav flex-column">
            <a class="sidebar-link" href="/admin/index.html">📊 Dashboard</a>
            <a class="sidebar-link" href="/admin/products.html">🥤 Quản lý sản phẩm</a>
            <a class="sidebar-link active" href="/admin/orders.html">📦 Quản lý đơn hàng</a>
            <a class="sidebar-link" href="/admin/users.html">👥 Quản lý người dùng</a>
            <a class="sidebar-link" href="/admin/coupons.html">🎟️ Quản lý khuyến mãi</a>
            <a class="sidebar-link text-danger mt-5" href="#" onclick="auth.logout()">🚪 Đăng xuất</a>
        </nav>
    </div>

    <div class="flex-grow-1 p-4" style="margin-left: 280px;">
        <h2 class="fw-bold mb-4">📦 Quản lý đơn hàng</h2>
        <div class="card border-0 shadow-sm p-4" style="border-radius: 20px;">
            <div id="orders-table"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAccess('ADMIN')) return;
        const host = document.getElementById('orders-table');

        async function loadOrders() {
            const orders = await apiFetch('/admin/orders');
            if (!orders.length) {
                host.innerHTML = '<p class="text-muted mb-0">Chưa có đơn hàng.</p>';
                return;
            }
            host.innerHTML = `
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead><tr><th>Mã đơn</th><th>Ngày tạo</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead>
                        <tbody>
                            ${orders.reverse().map(order => `
                                <tr>
                                    <td class="fw-semibold">${order.maDonHang}</td>
                                    <td>${new Date(order.ngayTao).toLocaleString('vi-VN')}</td>
                                    <td>${ui.formatCurrency(order.thanhTien)}</td>
                                    <td>
                                        <select class="form-select form-select-sm" style="width: 180px;" onchange="updateOrderStatus(${order.id}, this.value)">
                                            ${['MOI_TAO','CHO_XU_LY','DANG_CHE_BIEN','DANG_GIAO','HOAN_THANH','DA_HUY'].map(st => `<option value="${st}" ${order.trangThai === st ? 'selected' : ''}>${st}</option>`).join('')}
                                        </select>
                                    </td>
                                    <td class="small">${(order.items || []).map(i => `${i.soLuong}x ${i.tenSanPham}`).join(', ')}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.updateOrderStatus = async (id, status) => {
            await apiFetch(`/admin/orders/${id}/status?status=${status}`, { method: 'PATCH' });
            ui.showToast('Cập nhật trạng thái thành công');
            loadOrders();
        };

        await loadOrders();
    });
</script>
</body>
</html>
