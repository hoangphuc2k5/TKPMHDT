<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản lý khuyến mãi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="d-flex">
    <div class="sidebar d-none d-lg-block" style="width: 280px; position: fixed;">
        <a class="navbar-brand mb-5 d-block text-center" href="/">DRINK<span style="color: var(--primary-blue);">STORE</span></a>
        <nav class="nav flex-column">
            <a class="sidebar-link" href="/admin/index.html">📊 Dashboard</a>
            <a class="sidebar-link" href="/admin/products.html">🥤 Quản lý sản phẩm</a>
            <a class="sidebar-link" href="/admin/orders.html">📦 Quản lý đơn hàng</a>
            <a class="sidebar-link" href="/admin/users.html">👥 Quản lý người dùng</a>
            <a class="sidebar-link active" href="/admin/coupons.html">🎟️ Quản lý khuyến mãi</a>
            <a class="sidebar-link text-danger mt-5" href="#" onclick="auth.logout()">🚪 Đăng xuất</a>
        </nav>
    </div>

    <div class="flex-grow-1 p-4" style="margin-left: 280px;">
        <h2 class="fw-bold mb-4">🎟️ Quản lý khuyến mãi</h2>
        <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 20px;">
            <form id="coupon-form" class="row g-3">
                <input type="hidden" id="coupon-id">
                <div class="col-md-2"><input id="coupon-code" class="form-control" placeholder="Mã" required></div>
                <div class="col-md-2"><input id="coupon-value" type="number" class="form-control" placeholder="Giá trị giảm" required></div>
                <div class="col-md-2">
                    <select id="coupon-type" class="form-select">
                        <option value="PHAN_TRAM">%</option>
                        <option value="TIEN_MAT">VNĐ</option>
                    </select>
                </div>
                <div class="col-md-2"><input id="coupon-max-use" type="number" class="form-control" placeholder="Số lượt tối đa" value="100"></div>
                <div class="col-md-2"><input id="coupon-end" type="datetime-local" class="form-control"></div>
                <div class="col-md-2 d-grid"><button class="btn btn-primary" type="submit">Lưu</button></div>
                <div class="col-12"><input id="coupon-desc" class="form-control" placeholder="Mô tả"></div>
            </form>
        </div>
        <div class="card border-0 shadow-sm p-4" style="border-radius: 20px;">
            <div id="coupon-table"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAccess('ADMIN')) return;
        const form = document.getElementById('coupon-form');
        const table = document.getElementById('coupon-table');
        let couponCache = [];

        function fillForm(c) {
            document.getElementById('coupon-id').value = c.id || '';
            document.getElementById('coupon-code').value = c.ma || '';
            document.getElementById('coupon-value').value = c.giaTriGiam || 0;
            document.getElementById('coupon-type').value = c.loaiGiamGia || 'PHAN_TRAM';
            document.getElementById('coupon-max-use').value = c.soLuongSuDungToiDa || 0;
            document.getElementById('coupon-desc').value = c.moTa || '';
            if (c.ngayKetThuc) {
                document.getElementById('coupon-end').value = c.ngayKetThuc.substring(0, 16);
            }
        }

        async function loadCoupons() {
            const coupons = await apiFetch('/admin/coupons');
            couponCache = coupons;
            if (!coupons.length) {
                table.innerHTML = '<p class="text-muted mb-0">Chưa có mã giảm giá.</p>';
                return;
            }
            table.innerHTML = `
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead><tr><th>Mã</th><th>Giá trị</th><th>Đã dùng/Tối đa</th><th>Hết hạn</th><th></th></tr></thead>
                        <tbody>
                            ${coupons.map(c => `
                                <tr>
                                    <td class="fw-semibold">${c.ma}</td>
                                    <td>${c.loaiGiamGia === 'PHAN_TRAM' ? `${c.giaTriGiam}%` : ui.formatCurrency(c.giaTriGiam)}</td>
                                    <td>${c.soLuongDaSuDung || 0}/${c.soLuongSuDungToiDa || 0}</td>
                                    <td>${c.ngayKetThuc ? new Date(c.ngayKetThuc).toLocaleString('vi-VN') : ''}</td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-outline-primary me-1" onclick='editCoupon(${c.id})'>Sửa</button>
                                        <button class="btn btn-sm btn-outline-danger" onclick="deleteCoupon(${c.id})">Xóa</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>`;
        }

        window.editCoupon = (id) => {
            const coupon = couponCache.find(c => c.id === id);
            if (!coupon) return;
            fillForm(coupon);
        };
        window.deleteCoupon = async (id) => {
            if (!confirm('Xóa mã giảm giá?')) return;
            await apiFetch(`/admin/coupons/${id}`, { method: 'DELETE' });
            ui.showToast('Đã xóa mã giảm giá');
            loadCoupons();
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('coupon-id').value;
            const payload = {
                ma: document.getElementById('coupon-code').value.toUpperCase(),
                giaTriGiam: parseFloat(document.getElementById('coupon-value').value || '0'),
                loaiGiamGia: document.getElementById('coupon-type').value,
                soLuongSuDungToiDa: parseInt(document.getElementById('coupon-max-use').value || '0'),
                moTa: document.getElementById('coupon-desc').value,
                ngayKetThuc: document.getElementById('coupon-end').value ? `${document.getElementById('coupon-end').value}:00` : ''
            };
            if (id) await apiFetch(`/admin/coupons/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
            else await apiFetch('/admin/coupons', { method: 'POST', body: JSON.stringify(payload) });
            ui.showToast('Lưu mã giảm giá thành công');
            form.reset();
            document.getElementById('coupon-id').value = '';
            loadCoupons();
        });

        await loadCoupons();
    });
</script>
</body>
</html>
