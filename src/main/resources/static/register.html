<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Drink Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card border-0 shadow-medium p-5" style="border-radius: 30px; width: 550px;">
            <div class="text-center mb-5">
                <a href="/" class="navbar-brand mb-4 d-block">DRINK<span style="color: var(--primary-blue);">STORE</span></a>
                <h4 class="fw-bold">Tạo tài khoản mới</h4>
                <p class="text-muted">Bắt đầu trải nghiệm đồ uống của riêng bạn</p>
            </div>
            
            <form id="register-form">
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Tên đăng nhập</label>
                        <input type="text" id="username" class="form-control" placeholder="Tên đăng nhập" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Họ tên</label>
                        <input type="text" id="fullname" class="form-control" placeholder="Họ tên" required>
                    </div>
                    <div class="col-md-12 mb-4">
                        <label class="form-label fw-bold">Mật khẩu</label>
                        <input type="password" id="password" class="form-control" placeholder="Mật khẩu" required>
                    </div>
                    <div class="col-md-12 mb-4">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Địa chỉ email" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Số điện thoại</label>
                        <input type="tel" id="phone" class="form-control" placeholder="Số điện thoại" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Địa chỉ</label>
                        <input type="text" id="address" class="form-control" placeholder="Địa chỉ" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg mb-4">Đăng ký ngay</button>
            </form>
            
            <p class="text-center mb-0">Bạn đã có tài khoản? <a href="/login.html" class="text-primary text-decoration-none fw-bold">Đăng nhập ngay</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/app/pages/register.js"></script>
</body>
</html>
