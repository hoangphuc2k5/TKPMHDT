<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý kho - Drink Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">DRINK<span style="color: var(--primary-blue);">STORE</span> | WAREHOUSE</a>
            <div id="user-info" class="dropdown ms-3">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown">
                    <span id="username-display">Quản lý kho</span>
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item text-danger" href="#" onclick="auth.logout()">Đăng xuất</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 class="fw-bold mb-0">📦 Tồn kho nguyên liệu</h2>
            <div class="d-flex gap-2">
                <button onclick="loadAlerts()" class="btn btn-outline-danger">⚠️ Cảnh báo hết hàng</button>
                <button onclick="loadInventory()" class="btn btn-outline-primary">🔄 Làm mới</button>
            </div>
        </div>
        
        <div class="card border-0 shadow-sm p-4 mb-5" style="border-radius: 20px;">
            <div id="inventory-list" class="table-responsive">
                <!-- Inventory will be loaded here -->
                <div class="text-center py-5">
                    <div class="spinner-border text-primary"></div>
                </div>
            </div>
        </div>

        <h4 class="fw-bold mb-4">📥 Nhập kho nhanh</h4>
        <div class="card border-0 shadow-sm p-4" style="border-radius: 20px;">
            <form id="import-form">
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Nguyên liệu</label>
                        <select id="import-id" class="form-select" required>
                            <!-- Options will be loaded -->
                        </select>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label fw-bold">Số lượng</label>
                        <input type="number" id="import-qty" class="form-control" step="0.1" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Lô hàng</label>
                        <input type="text" id="import-batch" class="form-control" placeholder="BATCH-2026-XX">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label fw-bold">Hạn sử dụng</label>
                        <input type="date" id="import-expiry" class="form-control">
                    </div>
                    <div class="col-md-2 mb-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Xác nhận nhập</button>
                    </div>
                </div>
            </form>
        </div>

        <h4 class="fw-bold mb-4 mt-5">📤 Xuất kho theo đơn hàng</h4>
        <div class="card border-0 shadow-sm p-4" style="border-radius: 20px;">
            <form id="export-form" class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">Nguyên liệu</label>
                    <select id="export-id" class="form-select" required></select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label fw-bold">Số lượng xuất</label>
                    <input type="number" id="export-qty" class="form-control" step="0.1" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label fw-bold">Ghi chú</label>
                    <input type="text" id="export-note" class="form-control">
                </div>
                <div class="col-md-2 mb-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-warning w-100">Xác nhận xuất</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAccess('QUAN_LY_KHO')) return;
            
            document.getElementById('username-display').innerText = localStorage.getItem('username') || 'Kho';
            
            async function loadInventory() {
                try {
                    const items = await apiFetch('/warehouse/inventory');
                    const container = document.getElementById('inventory-list');
                    const select = document.getElementById('import-id');
                    const exportSelect = document.getElementById('export-id');
                    
                    select.innerHTML = '<option value="">Chọn nguyên liệu...</option>';
                    exportSelect.innerHTML = '<option value="">Chọn nguyên liệu...</option>';
                    
                    let html = `
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Tên nguyên liệu</th>
                                    <th>Số lượng tồn</th>
                                    <th>Đơn vị</th>
                                    <th>Lô gần nhất</th>
                                    <th>Hạn sử dụng</th>
                                    <th>Trạng thái</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    items.forEach(item => {
                        const isLow = item.soLuongTon <= item.nguongCanhBao;
                        select.innerHTML += `<option value="${item.id}">${item.ten}</option>`;
                        exportSelect.innerHTML += `<option value="${item.id}">${item.ten}</option>`;
                        
                        html += `
                            <tr>
                                <td class="fw-bold">${item.ten}</td>
                                <td class="${isLow ? 'text-danger fw-bold' : ''}">${item.soLuongTon}</td>
                                <td>${item.donViTinh}</td>
                                <td class="small">${item.loHang || 'N/A'}</td>
                                <td class="small">${item.hanSuDung || 'N/A'}</td>
                                <td>
                                    ${isLow ? '<span class="badge bg-danger">Sắp hết hàng</span>' : '<span class="badge bg-success">Ổn định</span>'}
                                </td>
                            </tr>
                        `;
                    });

                    html += '</tbody></table>';
                    container.innerHTML = html;
                } catch (error) {
                    ui.showToast(error.message, 'danger');
                }
            }

            async function loadAlerts() {
                try {
                    const items = await apiFetch('/warehouse/alerts');
                    if (items.length === 0) {
                        ui.showToast('Không có cảnh báo tồn kho thấp', 'success');
                        return;
                    }
                    // Render only alert items (same as loadInventory but filtered)
                    ui.showToast(`Có ${items.length} nguyên liệu sắp hết hàng!`, 'warning');
                } catch (error) {
                    ui.showToast(error.message, 'danger');
                }
            }

            document.getElementById('import-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const data = {
                    nguyenLieuId: document.getElementById('import-id').value,
                    soLuongThem: parseFloat(document.getElementById('import-qty').value),
                    loHang: document.getElementById('import-batch').value,
                    hanSuDung: document.getElementById('import-expiry').value
                };

                try {
                    await apiFetch('/warehouse/import', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                    ui.showToast('Nhập kho thành công!');
                    loadInventory();
                    e.target.reset();
                } catch (error) {
                    ui.showToast(error.message, 'danger');
                }
            });

            document.getElementById('export-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const data = {
                    nguyenLieuId: document.getElementById('export-id').value,
                    soLuongXuat: parseFloat(document.getElementById('export-qty').value),
                    ghiChu: document.getElementById('export-note').value
                };
                try {
                    await apiFetch('/warehouse/export', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                    ui.showToast('Xuất kho thành công!');
                    loadInventory();
                    e.target.reset();
                } catch (error) {
                    ui.showToast(error.message, 'danger');
                }
            });

            loadInventory();
            window.loadInventory = loadInventory;
            window.loadAlerts = loadAlerts;
        });
    </script>
</body>
</html>
