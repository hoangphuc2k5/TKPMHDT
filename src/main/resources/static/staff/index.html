<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff POS - Drink Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">DRINK<span style="color: var(--primary-blue);">STORE</span> | STAFF</a>
            <div id="user-info" class="dropdown ms-3">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown">
                    <span id="username-display">Nhân viên</span>
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item text-danger" href="#" onclick="auth.logout()">Đăng xuất</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="card border-0 shadow-sm p-4 mb-5" style="border-radius: 20px;">
            <h4 class="fw-bold mb-3">🧾 Tạo đơn tại quầy (POS)</h4>
            <form id="pos-form" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Khách hàng</label>
                    <input id="pos-customer" class="form-control" placeholder="Khách lẻ">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">SĐT</label>
                    <input id="pos-phone" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Mã giảm giá</label>
                    <input id="pos-coupon" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Thanh toán</label>
                    <select id="pos-payment" class="form-select">
                        <option value="TIEN_MAT">Tiền mặt</option>
                        <option value="CHUYEN_KHOAN">Chuyển khoản</option>
                        <option value="VI_DIEN_TU">Ví điện tử</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Ghi chú</label>
                    <input id="pos-note" class="form-control">
                </div>
                <div class="col-md-8">
                    <label class="form-label fw-semibold">Sản phẩm</label>
                    <div class="d-flex gap-2">
                        <select id="pos-product" class="form-select"></select>
                        <input id="pos-qty" type="number" class="form-control" min="1" value="1" style="max-width: 100px;">
                        <button class="btn btn-outline-primary" type="button" id="pos-add-item">Thêm</button>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Tạm tính</label>
                    <div id="pos-total" class="form-control bg-light fw-bold">0đ</div>
                </div>
                <div class="col-12">
                    <div id="pos-items" class="small text-muted">Chưa có sản phẩm nào.</div>
                </div>
                <div class="col-12 d-grid">
                    <button type="submit" class="btn btn-primary">Tạo đơn tại quầy</button>
                </div>
            </form>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 class="fw-bold mb-0">📦 Quản lý đơn hàng</h2>
            <button onclick="loadOrders()" class="btn btn-outline-primary">🔄 Làm mới</button>
        </div>
        
        <div class="card border-0 shadow-sm p-4" style="border-radius: 20px;">
            <div id="staff-orders-list" class="table-responsive">
                <!-- Orders will be loaded here -->
                <div class="text-center py-5">
                    <div class="spinner-border text-primary"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Invoice Modal -->
    <div class="modal fade" id="invoiceModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="border-radius: 30px; border: none; overflow: hidden;">
                <div class="modal-header bg-primary text-white p-4">
                    <h5 class="modal-title fw-bold">🧾 In hóa đơn</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4" id="invoice-content">
                    <!-- HTML content from API -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary" onclick="window.print()">🖨️ In ngay</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAccess('NHAN_VIEN_BAN_HANG')) return;
            
            document.getElementById('username-display').innerText = localStorage.getItem('username') || 'Nhân viên';
            
            async function loadOrders() {
                try {
                    const orders = await apiFetch('/staff/orders');
                    const container = document.getElementById('staff-orders-list');
                    
                    if (!orders || orders.length === 0) {
                        container.innerHTML = '<div class="text-center py-5"><h4>Hiện tại chưa có đơn hàng nào</h4></div>';
                        return;
                    }

                    let html = `
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Mã đơn</th>
                                    <th>Khách hàng</th>
                                    <th>Tổng tiền</th>
                                    <th>Trạng thái</th>
                                    <th>Ngày đặt</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    orders.reverse().forEach(order => {
                        html += `
                            <tr>
                                <td class="fw-bold">${order.maDonHang}</td>
                                <td>${order.diaChiGiaoHang}</td>
                                <td class="fw-bold text-orange">${ui.formatCurrency(order.thanhTien)}</td>
                                <td>
                                    <select onchange="updateStatus(${order.id}, this.value)" class="form-select form-select-sm" style="width: 150px;">
                                        <option value="MOI_TAO" ${order.trangThai === 'MOI_TAO' ? 'selected' : ''}>Mới tạo</option>
                                        <option value="CHO_XU_LY" ${order.trangThai === 'CHO_XU_LY' ? 'selected' : ''}>Chờ xử lý</option>
                                        <option value="DANG_CHE_BIEN" ${order.trangThai === 'DANG_CHE_BIEN' ? 'selected' : ''}>Đang chế biến</option>
                                        <option value="DANG_GIAO" ${order.trangThai === 'DANG_GIAO' ? 'selected' : ''}>Đang giao</option>
                                        <option value="HOAN_THANH" ${order.trangThai === 'HOAN_THANH' ? 'selected' : ''}>Hoàn thành</option>
                                        <option value="DA_HUY" ${order.trangThai === 'DA_HUY' ? 'selected' : ''}>Đã hủy</option>
                                    </select>
                                </td>
                                <td class="small">${new Date(order.ngayTao).toLocaleString('vi-VN')}</td>
                                <td>
                                    <button class="btn btn-outline-primary btn-sm me-1" onclick="showInvoice(${order.id})">🧾 Hóa đơn</button>
                                    <button class="btn btn-outline-secondary btn-sm" onclick="showDeliveryNote(${order.id})">🚚 Phiếu giao</button>
                                </td>
                            </tr>
                        `;
                    });

                    html += '</tbody></table>';
                    container.innerHTML = html;
                } catch (error) {
                    ui.showToast(error.message, 'danger');
                }
            }

            window.updateStatus = async (id, status) => {
                try {
                    await apiFetch(`/staff/orders/${id}/status?status=${status}`, { method: 'PATCH' });
                    ui.showToast('Đã cập nhật trạng thái đơn hàng!');
                    loadOrders();
                } catch (error) {
                    ui.showToast(error.message, 'danger');
                }
            };

            window.showInvoice = async (id) => {
                try {
                    const htmlContent = await apiFetch(`/staff/orders/${id}/invoice`);
                    document.getElementById('invoice-content').innerHTML = htmlContent;
                    const modal = new bootstrap.Modal(document.getElementById('invoiceModal'));
                    modal.show();
                } catch (error) {
                    ui.showToast(error.message, 'danger');
                }
            };

            window.showDeliveryNote = async (id) => {
                try {
                    const htmlContent = await apiFetch(`/staff/orders/${id}/delivery-note`);
                    document.getElementById('invoice-content').innerHTML = htmlContent;
                    const modal = new bootstrap.Modal(document.getElementById('invoiceModal'));
                    modal.show();
                } catch (error) {
                    ui.showToast(error.message, 'danger');
                }
            };

            const posItems = [];
            function renderPosItems() {
                const host = document.getElementById('pos-items');
                if (!posItems.length) {
                    host.innerHTML = 'Chưa có sản phẩm nào.';
                    document.getElementById('pos-total').innerText = ui.formatCurrency(0);
                    return;
                }
                const total = posItems.reduce((sum, i) => sum + (i.gia * i.soLuong), 0);
                document.getElementById('pos-total').innerText = ui.formatCurrency(total);
                host.innerHTML = posItems.map((item, index) => `
                    <div class="d-flex justify-content-between py-1 border-bottom">
                        <span>${item.ten} x ${item.soLuong}</span>
                        <span>${ui.formatCurrency(item.gia * item.soLuong)} <a href="#" onclick="removePosItem(${index}); return false;" class="text-danger ms-2">xóa</a></span>
                    </div>
                `).join('');
            }
            window.removePosItem = (index) => {
                posItems.splice(index, 1);
                renderPosItems();
            };

            async function loadPosProducts() {
                const products = await apiFetch('/products/search');
                const select = document.getElementById('pos-product');
                select.innerHTML = products.map(p => `<option value="${p.id}" data-gia="${p.gia}" data-ten="${p.ten}">${p.ten} - ${ui.formatCurrency(p.gia)}</option>`).join('');
            }
            document.getElementById('pos-add-item').addEventListener('click', () => {
                const select = document.getElementById('pos-product');
                const option = select.options[select.selectedIndex];
                if (!option) return;
                const quantity = parseInt(document.getElementById('pos-qty').value || '1');
                posItems.push({
                    sanPhamId: parseInt(option.value),
                    soLuong: quantity,
                    ten: option.dataset.ten,
                    gia: parseFloat(option.dataset.gia || '0')
                });
                renderPosItems();
            });
            document.getElementById('pos-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!posItems.length) {
                    ui.showToast('Vui lòng thêm sản phẩm cho đơn tại quầy', 'warning');
                    return;
                }
                const payload = {
                    tenKhach: document.getElementById('pos-customer').value,
                    soDienThoai: document.getElementById('pos-phone').value,
                    maGiamGia: document.getElementById('pos-coupon').value,
                    phuongThucThanhToan: document.getElementById('pos-payment').value,
                    ghiChu: document.getElementById('pos-note').value,
                    items: posItems.map(i => ({ sanPhamId: i.sanPhamId, soLuong: i.soLuong }))
                };
                await apiFetch('/staff/pos-order', { method: 'POST', body: JSON.stringify(payload) });
                ui.showToast('Tạo đơn tại quầy thành công');
                posItems.splice(0, posItems.length);
                renderPosItems();
                e.target.reset();
                loadOrders();
            });

            await loadPosProducts();
            loadOrders();
            window.loadOrders = loadOrders;
        });
    </script>
</body>
</html>
