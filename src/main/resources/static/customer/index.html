<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Khách Hàng - Drink Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Drink Store</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#" id="cartBtn">🛒 Giỏ hàng</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="auth.logout()">Đăng xuất</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card p-3">
                    <h5>Bộ lọc</h5>
                    <div class="mb-3">
                        <label>Tên nước</label>
                        <input type="text" id="searchName" class="form-control" placeholder="Tìm kiếm...">
                    </div>
                    <div class="mb-3">
                        <label>Giá tối đa</label>
                        <input type="number" id="maxPrice" class="form-control">
                    </div>
                    <button class="btn btn-outline-primary w-100" id="filterBtn">Áp dụng</button>
                </div>
            </div>
            <div class="col-md-9">
                <div id="productList" class="row">
                    <!-- Danh sách sản phẩm -->
                </div>
            </div>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productTitle">Chi tiết sản phẩm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="productDetail">
                    <!-- Nội dung chi tiết -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary" id="addToCartBtn">Thêm vào giỏ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/customer.js"></script>
</body>
</html>
