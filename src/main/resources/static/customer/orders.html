<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng của tôi - Drink Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar (Same as index.html) -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">DRINK<span style="color: var(--primary-blue);">STORE</span></a>
            <div id="user-info" class="dropdown ms-3">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown">
                    <span id="username-display">User</span>
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#" onclick="auth.logout()">Đăng xuất</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="fw-bold mb-5">📋 Lịch sử đơn hàng</h2>
        
        <div id="orders-list">
            <!-- Orders will be loaded here -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!checkAccess()) return;
            document.getElementById('username-display').innerText = localStorage.getItem('username') || 'User';
            const container = document.getElementById('orders-list');
            let timer = null;

            function getStatusColor(status) {
                if (status === 'MOI_TAO') return '#2196F3';
                if (status === 'CHO_XU_LY') return '#FF9800';
                if (status === 'DANG_CHE_BIEN') return '#9C27B0';
                if (status === 'DANG_GIAO') return '#03A9F4';
                if (status === 'HOAN_THANH') return '#4CAF50';
                if (status === 'DA_HUY') return '#F44336';
                return '#607D8B';
            }

            function getStatusText(status) {
                if (status === 'MOI_TAO') return 'Mới tạo';
                if (status === 'CHO_XU_LY') return 'Chờ xử lý';
                if (status === 'DANG_CHE_BIEN') return 'Đang chế biến';
                if (status === 'DANG_GIAO') return 'Đang giao hàng';
                if (status === 'HOAN_THANH') return 'Hoàn thành';
                if (status === 'DA_HUY') return 'Đã hủy';
                return status;
            }

            async function loadOrders() {
                try {
                    const orders = await apiFetch('/orders/history');
                    if (!orders || orders.length === 0) {
                        container.innerHTML = '<div class="text-center py-5"><h4>Bạn chưa có đơn hàng nào</h4><a href="/product-list.html" class="btn btn-primary mt-3">Mua sắm ngay</a></div>';
                        return;
                    }
                    container.innerHTML = '';
                    orders.reverse().forEach(order => {
                        const itemsHtml = (order.items || []).map(item => `
                            <div class="d-flex justify-content-between mb-1 small">
                                <span>${item.soLuong}x ${item.tenSanPham}</span>
                                <span>${ui.formatCurrency(item.thanhTien)}</span>
                            </div>
                        `).join('');
                        container.innerHTML += `
                            <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 20px;">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h5 class="fw-bold mb-0">Mã đơn: ${order.maDonHang}</h5>
                                    <span class="badge" style="background-color: ${getStatusColor(order.trangThai)};">${getStatusText(order.trangThai)}</span>
                                </div>
                                <div class="row">
                                    <div class="col-md-8 border-end">
                                        <h6 class="fw-bold mb-2">Chi tiết sản phẩm:</h6>
                                        ${itemsHtml}
                                        <hr>
                                        <div class="d-flex justify-content-between fw-bold">
                                            <span>Tổng thanh toán:</span>
                                            <span class="text-orange">${ui.formatCurrency(order.thanhTien)}</span>
                                        </div>
                                    </div>
                                    <div class="col-md-4 ps-md-4">
                                        <h6 class="fw-bold mb-2">Theo dõi trạng thái:</h6>
                                        <p class="small text-muted mb-1">⏱️ Cập nhật realtime mỗi 8 giây</p>
                                        <p class="small text-muted mb-1">📅 Ngày đặt: ${new Date(order.ngayTao).toLocaleString('vi-VN')}</p>
                                        <p class="small text-muted mb-2">📍 Địa chỉ: ${order.diaChiGiaoHang || 'Nhận tại quầy'}</p>
                                        ${order.trangThai === 'MOI_TAO' || order.trangThai === 'CHO_XU_LY' ? `<button onclick="cancelOrder(${order.id})" class="btn btn-outline-danger btn-sm w-100">Hủy đơn hàng</button>` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } catch (error) {
                    ui.showToast(error.message, 'danger');
                }
            }

            window.cancelOrder = async (id) => {
                if (!confirm('Bạn có chắc chắn muốn hủy đơn hàng này?')) return;
                try {
                    await apiFetch(`/orders/${id}/cancel`, { method: 'POST' });
                    ui.showToast('Đã hủy đơn hàng');
                    await loadOrders();
                } catch (error) {
                    ui.showToast(error.message, 'danger');
                }
            };

            await loadOrders();
            timer = setInterval(loadOrders, 8000);
            window.addEventListener('beforeunload', () => clearInterval(timer));
        });
    </script>
</body>
</html>
