<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - Drink Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header id="app-header"></header>

    <div class="container my-5">
        <h2 class="fw-bold mb-5">💳 Thanh toán đơn hàng</h2>
        
        <form id="checkout-form">
            <div class="row">
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 20px;">
                        <h5 class="fw-bold mb-4">Thông tin giao hàng</h5>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Địa chỉ giao hàng</label>
                            <input type="text" id="address" class="form-control form-control-lg" placeholder="Nhập địa chỉ..." required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Số điện thoại</label>
                            <input type="tel" id="phone" class="form-control form-control-lg" placeholder="Nhập số điện thoại..." required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Ghi chú cho shipper</label>
                            <textarea id="note" class="form-control" rows="3" placeholder="Lời nhắn..."></textarea>
                        </div>

                        <h5 class="fw-bold mt-5 mb-4">Phương thức thanh toán</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <div class="form-check p-3 border rounded-4 d-flex align-items-center">
                                    <input class="form-check-input me-3 ms-0" type="radio" name="payment-method" id="pay-cash" value="TIEN_MAT" checked>
                                    <label class="form-check-label flex-grow-1" for="pay-cash">
                                        💵 Tiền mặt (COD)
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <div class="form-check p-3 border rounded-4 d-flex align-items-center">
                                    <input class="form-check-input me-3 ms-0" type="radio" name="payment-method" id="pay-bank" value="CHUYEN_KHOAN">
                                    <label class="form-check-label flex-grow-1" for="pay-bank">
                                        🏦 Chuyển khoản
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="card border-0 shadow-sm p-4" style="border-radius: 20px;">
                        <h5 class="fw-bold mb-4">Xác nhận đơn hàng</h5>
                        
                        <div id="order-items-summary" class="mb-4">
                            <!-- Items will be loaded here -->
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Tạm tính:</span>
                            <span id="subtotal" class="fw-bold">0đ</span>
                        </div>

                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Phí giao hàng:</span>
                            <span class="fw-bold text-success">Miễn phí</span>
                        </div>

                        <div class="d-flex justify-content-between mb-4">
                            <span class="fs-5 fw-bold">Tổng thanh toán:</span>
                            <span id="total" class="fs-4 fw-bold text-orange">0đ</span>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-lg">Xác nhận đặt hàng</button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <footer id="app-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/app/pages/checkout.js"></script>
</body>
</html>
