<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm - Drink Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header id="app-header"></header>

    <div class="container my-5">
        <div class="row">
            <!-- Filters Sidebar -->
            <div class="col-lg-3">
                <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 20px;">
                    <h5 class="fw-bold mb-4">Bộ lọc tìm kiếm</h5>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Tìm kiếm</label>
                        <input type="text" id="search-input" class="form-control" placeholder="Tên sản phẩm...">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Loại đồ uống</label>
                        <select id="type-filter" class="form-select">
                            <option value="">Tất cả</option>
                            <option value="NUOC_UONG_SAN">Đồ uống đóng chai</option>
                            <option value="NGUYEN_LIEU">Nguyên liệu pha chế</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Giá từ: <span id="price-value">0đ</span></label>
                        <input type="range" class="form-range ingredient-slider" id="price-filter" min="0" max="200000" step="5000" value="200000">
                    </div>

                    <button id="apply-filters" class="btn btn-primary w-100">Áp dụng bộ lọc</button>
                </div>
            </div>

            <!-- Product Grid -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold mb-0">Tất cả sản phẩm</h3>
                    <span class="text-muted" id="results-count">Đang tải...</span>
                </div>

                <div id="product-grid" class="row">
                    <!-- Products will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <footer id="app-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/app/pages/products.js"></script>
</body>
</html>
