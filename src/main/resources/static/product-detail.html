<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - Drink Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header id="app-header"></header>

    <div class="container my-5">
        <div id="product-detail-container" class="row">
            <!-- Product detail will be loaded here -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary"></div>
            </div>
        </div>
    </div>

    <footer id="app-footer"></footer>

    <!-- Custom Drink Modal -->
    <div class="modal fade" id="customDrinkModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="border-radius: 30px; border: none; overflow: hidden;">
                <div class="modal-header bg-primary text-white p-4">
                    <h5 class="modal-title fw-bold">🎨 Tạo đồ uống riêng của bạn</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="row">
                        <div class="col-md-6 border-end">
                            <h6 class="fw-bold mb-3">Thành phần & Công thức</h6>
                            <div id="formula-list" class="mb-4">
                                <!-- Ingredients will be listed here -->
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Ghi chú tùy chỉnh</label>
                                <textarea id="custom-note" class="form-control" rows="3" placeholder="Ví dụ: Ít đường, nhiều đá..."></textarea>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h6 class="fw-bold mb-3">Tóm tắt đơn hàng</h6>
                            <div class="card bg-light border-0 p-3 mb-4">
                                <p id="custom-summary" class="mb-0">Đang tính toán...</p>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <span class="fs-5 fw-bold">Giá tạm tính:</span>
                                <span id="realtime-price" class="fs-4 fw-bold text-orange">0đ</span>
                            </div>
                            <button id="confirm-custom-add" class="btn btn-primary w-100 btn-lg">Thêm vào giỏ hàng</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/app/pages/productDetail.js"></script>
</body>
</html>
