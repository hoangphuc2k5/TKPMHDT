<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Trang chủ - 4it2run')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('home')}"></header>

<div class="container">
    <!-- Chỉ khách / chưa đăng nhập (admin & nhân viên bị chuyển hướng từ PageController) -->
    <div sec:authorize="hasRole('KHACH_HANG') or !isAuthenticated()">
    <!-- Hero -->
    <div style="background: var(--phuclong-green); color: white; padding: 60px; border-radius: var(--radius-lg); margin-bottom: 50px; display: flex; align-items: center; justify-content: space-between; overflow: hidden; position: relative;">
        <div style="max-width: 600px; z-index: 1;">
            <h1 style="color: white; font-size: 3.5rem; margin-bottom: 1rem;">Uống vào, chạy ra</h1>
            <p style="font-size: 1.1rem; opacity: 0.9; margin-bottom: 2rem;">Từ những búp trà xanh và hạt cà 1phê chất lượng nhất, chúng tôi mang đến cho bạn hương vị nguyên bản của drink.</p>
            <div style="display: flex; gap: 15px;">
                <a th:href="@{/ui/san-pham}"><button class="btn-highlight">Khám phá menu</button></a>
                <span sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}"><button class="btn-secondary" style="border-color: white; color: white;">Đăng nhập ngay</button></a>
                </span>
            </div>
        </div>
        <div style="font-size: 200px; opacity: 0.1; position: absolute; right: -50px; bottom: -50px; pointer-events: none;">🍃</div>
    </div>

    <!-- Sản phẩm nổi bật -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2>Sản phẩm nổi bật</h2>
            <a th:href="@{/ui/san-pham}" style="color: var(--phuclong-green); font-weight: 600;">Xem tất cả &rarr;</a>
        </div>
        
        <!-- Hiển thị sản phẩm thực tế từ Database -->
        <div class="grid" th:if="${products != null and !products.empty}">
            <div class="card" th:each="p : ${products}" th:data-id="${p.id}" ondblclick="viewProductDetail(this.dataset.id)"
                 style="position: relative;">
                <div th:if="${p.dangKhuyenMai}" style="position: absolute; top: 10px; left: 10px; z-index: 2;">
                    <span class="badge" style="background: #0C713D; color: #fff; border: none; font-size: 0.72rem; padding: 5px 10px;">Giảm giá</span>
                </div>
                <!-- Lấy hình ảnh đầu tiên nếu có, nếu không dùng ảnh mặc định -->
                <img th:src="${p.hinhAnh != null and !p.hinhAnh.empty ? p.hinhAnh[0] : 'https://images.unsplash.com/photo-1544787210-282725509ce8?auto=format&fit=crop&w=800&q=80'}" 
                     class="product-img" th:alt="${p.ten}" th:style="${p.dangKhuyenMai ? 'opacity: 0.98;' : ''}">
                <div class="card-content">
                    <h3 th:text="${p.ten}">Tên sản phẩm</h3>
                    <p class="muted" th:text="${p.moTa}">Mô tả sản phẩm</p>
                    <div th:if="${p.dangKhuyenMai and p.nhanKhuyenMai != null}" style="margin-top: 8px;">
                        <span class="badge" style="background: #fff0f0; color: #b01030; border: 1px solid #f5c2c7; font-size: 0.75rem;" th:text="${p.nhanKhuyenMai}">-20%</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; gap: 0.5rem; flex-wrap: wrap;">
                        <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0;">
                            <th:block th:if="${p.dangKhuyenMai}">
                                <span class="muted" style="text-decoration: line-through; font-size: 0.9rem; font-weight: 500;"
                                      th:text="${#numbers.formatDecimal(p.gia, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span>
                                <span style="font-weight: 700; color: var(--phuclong-green);"
                                      th:text="${#numbers.formatDecimal(p.giaSauKhuyenMai, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span>
                            </th:block>
                            <th:block th:unless="${p.dangKhuyenMai}">
                                <span style="font-weight: 700; color: var(--phuclong-green);"
                                      th:text="${#numbers.formatDecimal(p.gia, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span>
                            </th:block>
                        </div>
                        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                            <button class="btn-secondary" style="margin: 0; padding: 5px 15px; font-size: 0.8rem;"
                                    th:data-id="${p.id}"
                                    onclick="viewProductDetail(this.dataset.id)">Thêm vào giỏ</button>
                            <button class="btn-highlight" style="margin: 0; padding: 5px 15px; font-size: 0.8rem;"
                                    th:attr="data-id=${p.id}"
                                    onclick="buyNow(this.getAttribute('data-id'))">Mua ngay</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Thông báo nếu không có sản phẩm nào trong database -->
        <div class="card" th:if="${products == null or products.empty}" style="padding: 40px; text-align: center;">
            <p class="muted">Hiện chưa có sản phẩm nào trong cửa hàng. Vui lòng quay lại sau!</p>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    const PENDING_CART_KEY = 'pendingAddToCart';

    function viewProductDetail(productId) {
        window.location.href = '/ui/san-pham/chi-tiet?id=' + encodeURIComponent(productId);
    }

    function savePendingCartItem(payload) {
        sessionStorage.setItem(PENDING_CART_KEY, JSON.stringify(payload));
    }

    function getPendingCartItem() {
        try {
            const raw = sessionStorage.getItem(PENDING_CART_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch (e) {
            return null;
        }
    }

    function clearPendingCartItem() {
        sessionStorage.removeItem(PENDING_CART_KEY);
    }

    function redirectToLogin() {
        const currentUrl = window.location.pathname + window.location.search;
        window.location.href = '/login?redirect=' + encodeURIComponent(currentUrl);
    }

    async function processPendingCartItem() {
        const pending = getPendingCartItem();
        if (!pending) {
            return;
        }

        try {
            const user = await api("GET", "/api/nguoi-dung/me");
            if (user && user.id) {
                pending.khachHangId = user.id;
                await api("POST", "/api/gio-hang/them-mat-hang", pending);
                clearPendingCartItem();
                showMessage('Đã tự động thêm vào giỏ hàng sau khi đăng nhập.');
            }
        } catch (e) {
            console.warn('Không thể xử lý giỏ hàng đang chờ:', e);
        }
    }

    document.addEventListener('DOMContentLoaded', processPendingCartItem);

    function buyNow(productId) {
        const params = new URLSearchParams({
            buyNow: 'true',
            productId: productId,
            quantity: '1',
            mucDa: '100',
            ghiChu: ''
        });
        window.location.href = '/ui/don-hang?' + params.toString();
    }
</script>

</body>
</html>
