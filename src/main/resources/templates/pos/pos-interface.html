<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('POS - Điểm bán hàng - 4it2run')}"></head>

<body>
    <header th:replace="~{fragments/layout :: header('pos-tao-don')}"></header>

    <div class="container">
        <div class="page-header">
            <div>
                <h1 class="brand-font">Bán Hàng Tại Quầy</h1>
                <p class="muted">Chọn món, tùy chỉnh và thanh toán nhanh cho khách tại cửa hàng.</p>
            </div>
            <div sec:authorize="!hasRole('NHAN_VIEN_BAN_HANG')"
                style="display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center;">
                <a href="/ui/pos" class="btn-secondary" style="text-decoration:none; margin-top:0;">Xem danh sách
                    đơn</a>
                <a href="/ui/don-hang" class="btn-secondary" style="text-decoration:none; margin-top:0;">Trang đơn
                    hàng</a>
            </div>
        </div>

        <div class="grid" style="grid-template-columns: 2fr 1fr; gap: 2rem;">

            <!-- Product Selector -->
            <div>
                <div style="margin-bottom: 1rem;">
                    <h2 class="brand-font" style="margin-top: 0;">Chọn món</h2>
                    <input id="searchProd" type="text" placeholder="Tìm tên món..."
                        style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 1rem;">
                </div>

                <div id="posProducts" class="pos-product-grid">
                    <!-- Products loaded via JS -->
                </div>
            </div>

            <!-- Order Summary / Checkout -->
            <div class="card" style="position: sticky; top: 100px; height: fit-content;">
                <div class="card-content">
                    <h3 class="brand-font" style="margin-top: 0;">Đơn hàng hiện tại</h3>

                    <div id="posOrder" style="max-height: 400px; overflow-y: auto; margin-bottom: 1rem;">
                        <!-- Items loaded here -->
                    </div>

                    <hr style="margin: 1rem 0;">

                    <div style="margin-bottom: 0.5rem;">
                        <div style="display: flex; justify-content: space-between;">
                            <span>Tạm tính:</span>
                            <span id="posSubtotal">0đ</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                            <span>Giảm giá:</span>
                            <span id="posDiscount" style="color: #e74c3c;">-0đ</span>
                        </div>
                        <div
                            style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; color: var(--phuclong-green);">
                            <span>Tổng:</span>
                            <span id="posTotal">0đ</span>
                        </div>
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label for="posCoupon" style="font-size: 0.875rem;">Mã giảm giá</label>
                        <input id="posCoupon" type="text" placeholder="Nhập mã..."
                            style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px;">
                    </div>

                    <button onclick="applyCouponPOS()" class="btn-secondary"
                        style="width: 100%; padding: 10px; margin-bottom: 1rem;">Áp dụng mã</button>


                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                        <button onclick="clearOrder()" class="btn-secondary" style="padding: 10px;">Xóa đơn</button>
                        <button onclick="saveDraftOrder()" class="btn-secondary" style="padding: 10px;">Lưu
                            nháp</button>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr; gap: 0.5rem; margin-top: 1rem;">
                        <button onclick="confirmOrder()" class="btn-highlight" style="padding: 12px;">Xác nhận đơn
                            hàng</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Customize Modal -->
        <div id="posModal"
            style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
            <div class="card" style="width: 90%; max-width: 500px;">
                <div class="card-content">
                    <h3 id="posModalTitle">Tùy chỉnh món</h3>
                    <input type="hidden" id="posModalProdId">


                    <div style="margin-bottom: 1rem;">
                        <label>Mức đá</label>
                        <select id="posIce"
                            style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px;">
                            <option value="100">100% (Bình thường)</option>
                            <option value="50">50% (Ít đá)</option>
                            <option value="0">0% (Không đá)</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label>Số lượng</label>
                        <input type="number" id="posQty" value="1" min="1"
                            style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px;">
                    </div>


                    <div style="margin-bottom: 1rem;">
                        <label>Topping</label>
                        <div id="posToppings"
                            style="max-height: 220px; overflow-y: auto; padding-right: 6px; border: 1px solid var(--border-color); border-radius: 8px; background: #fff;">
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem;">
                        <button onclick="closeModal()" class="btn-secondary" style="flex: 1;">Hủy</button>
                        <button onclick="addItemPOS()" class="btn-highlight" style="flex: 1;">Thêm vào đơn</button>
                    </div>


                </div>
            </div>
        </div>

        <!-- Customize Modal -->

        <div id="paymentModal"
            style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
            <div class="section-card" style="width:320px;">
                <h3>Thanh toán</h3>

                <div style="margin-bottom: 10px;">
                    <button onclick="selectPayment('TIEN_MAT')" style="width:100%; margin-bottom:5px;">
                        Tiền mặt
                    </button>

                    <button onclick="selectPayment('MOMO')" style="width:100%;">
                        MoMo
                    </button>
                </div>

                <hr>

                <button onclick="confirmPayment()" class="btn-highlight" style="width:100%; margin-top:10px;">
                    Xác nhận thanh toán
                </button>

                <button onclick="closePaymentModal()" style="width:100%; margin-top:5px;">
                    Hủy
                </button>
            </div>
        </div>

        <div id="invoiceModal"
            style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
            <div class="section-card" style="width:350px; max-height:80vh; overflow:auto;">
                <h3>Hóa đơn</h3>

                <div id="invoiceContent"></div>

                <button onclick="closeInvoice()" style="width:100%; margin-top:10px;">
                    Đóng
                </button>
            </div>
        </div>

        <!-- Messages -->
        <div id="message"
            style="display: none; position: fixed; top: 100px; right: 20px; background: var(--phuclong-green); color: white; padding: 1rem; border-radius: 8px; z-index: 999;">
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <style>
        .pos-product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
            gap: 1rem;
            max-height: 620px;
            overflow-y: auto;
        }
        .pos-product-card {
            overflow: hidden;
            padding: 0;
            display: flex;
            flex-direction: column;
        }
        .pos-product-card .pos-product-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
            background: var(--bg-subtle);
        }
        .pos-product-card .pos-product-body {
            padding: 0.75rem;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
    </style>

    <script th:inline="javascript">
        let posOrder = [];
        let allPosProducts = [];
        let currentProduct = null;
        let currentOrderId = null;
        let toppings = [];
        let toppingsLoaded = false;
        let selectedPaymentMethod = null;
        let currentPaymentId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            currentOrderId = localStorage.getItem("currentOrderId");

            if (!currentOrderId) {
                showMessage("Không tìm thấy đơn hàng", "error");
                setTimeout(() => {
                    window.location.href = "/ui/pos/danh-sach-don-hang";
                }, 1500);
                return;
            }

            const searchEl = document.getElementById('searchProd');
            if (searchEl) {
                searchEl.addEventListener('input', () => applyPosProductSearch());
            }

            loadProducts();
            loadToppingsOnce();
            loadOrder();

            console.log("Đang xử lý đơn:", currentOrderId); // debug
        });

        function posProductImageUrl(prod) {
            const list = prod && prod.hinhAnh;
            if (Array.isArray(list) && list.length > 0 && list[0]) {
                return list[0];
            }
            return '/uploads/default-drink.jpg';
        }

        const POS_ERR_NEED_NEW_ORDER =
            'Chỉ có thể thêm sản phẩm vào đơn hàng đang ở trạng thái CHO_XAC_NHAN';

        function isPosNeedNewOrderError(e) {
            const m = e && e.message != null ? String(e.message) : '';
            return m.includes(POS_ERR_NEED_NEW_ORDER);
        }

        function redirectToPosListNeedNewOrder() {
            localStorage.removeItem('currentOrderId');
            window.location.href = '/ui/pos?posTaoDonMoi=1';
        }

        function escapeHtml(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function posProductMatchesQuery(prod, q) {
            if (!q) return true;
            const needle = q.trim().toLowerCase();
            if (!needle) return true;
            const hay = [prod.ten, prod.moTa, prod.danhMuc]
                .filter(Boolean)
                .join(' ')
                .toLowerCase();
            return hay.includes(needle);
        }

        function applyPosProductSearch() {
            const q = document.getElementById('searchProd')?.value || '';
            const list = allPosProducts.filter(p => posProductMatchesQuery(p, q));
            renderPosProductCards(list);
        }

        function renderPosProductCards(products) {
            const container = document.getElementById('posProducts');
            if (!container) return;
            container.innerHTML = '';

            if (!products.length) {
                container.innerHTML = '<p class="muted" style="grid-column: 1 / -1; padding: 1rem;">Không có món phù hợp.</p>';
                return;
            }

            products.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'card pos-product-card';
                card.style.cursor = 'pointer';
                const imgSrc = posProductImageUrl(prod);
                const goc = Number(prod.gia || 0);
                const sau = prod.giaSauKhuyenMai != null ? Number(prod.giaSauKhuyenMai) : goc;
                const km = prod.dangKhuyenMai && sau < goc;
                const priceLine = km
                    ? `<p style="margin: 0 0 0.5rem; font-size: 0.88rem;">
                            <span style="text-decoration: line-through; color: #888;">${formatCurrency(goc)}</span>
                            <span style="color: var(--phuclong-green); font-weight: 700; margin-left: 8px;">${formatCurrency(sau)}</span>
                            <span style="display: inline-block; margin-left: 6px; font-size: 0.72rem; padding: 2px 6px; border-radius: 6px; background: #0C713D; color: #fff;">KM</span>
                       </p>`
                    : `<p style="color: var(--phuclong-green); font-weight: 700; margin: 0 0 0.5rem;">${formatCurrency(goc)}</p>`;
                card.innerHTML = `
                    <img class="pos-product-img" alt="">
                    <div class="pos-product-body">
                    <h4 style="margin: 0 0 0.5rem; font-size: 0.95rem;">${escapeHtml(prod.ten)}</h4>
                    ${priceLine}
                    </div>`;
                const imgEl = card.querySelector('.pos-product-img');
                imgEl.src = imgSrc;
                imgEl.alt = prod.ten || 'Sản phẩm';
                const chooseButton = document.createElement('button');
                chooseButton.className = 'btn-highlight';
                chooseButton.style.width = '100%';
                chooseButton.style.padding = '8px';
                chooseButton.style.fontSize = '0.85rem';
                chooseButton.style.marginTop = 'auto';
                chooseButton.textContent = 'Chọn';
                chooseButton.addEventListener('click', () => selectProduct(prod));
                card.querySelector('.pos-product-body').appendChild(chooseButton);
                container.appendChild(card);
            });
        }

        async function loadProducts() {
            try {
                const products = await api('GET', '/api/san-pham/nuoc-uong');
                allPosProducts = Array.isArray(products) ? products : [];
                applyPosProductSearch();
            } catch (e) {
                showMessage('Lỗi tải sản phẩm: ' + e.message);
            }
        }

        async function loadToppingsOnce() {
            if (toppingsLoaded) return;

            try {
                const res = await api('GET', '/api/nguyen-lieu/topping');

                // ⚠️ tùy backend bạn trả gì
                toppings = Array.isArray(res) ? res : res.data;

                toppingsLoaded = true;

                console.log("✅ Loaded toppings:", toppings);
            } catch (e) {
                console.error("❌ Lỗi load topping:", e);
                showMessage("Không tải được topping");
            }
        }

        function renderToppings() {
            const container = document.getElementById('posToppings');
            container.innerHTML = '';

            if (!toppings || toppings.length === 0) {
                container.innerHTML = '<p class="muted">Không có topping</p>';
                return;
            }

            toppings.forEach(t => {
                const price = Number(t.giaDonVi || 0);
                const unitRaw = (t.donVi || '').trim().toLowerCase();
                const needsMultiplier = unitRaw === 'g' || unitRaw === 'ml' || unitRaw.includes('g/ml') || unitRaw.includes('ml/g');
                const qtyPlaceholder = needsMultiplier ? '10' : '1';
                const qtyLabel = needsMultiplier ? `Mỗi 10 ${t.donVi}` : 'Số lượng';

                const el = document.createElement('div');
                el.style.display = 'grid';
                el.style.gridTemplateColumns = 'auto auto';
                el.style.gap = '10px';
                el.style.alignItems = 'center';
                el.style.border = '1px solid var(--border-color)';
                el.style.padding = '8px 10px';
                el.style.borderRadius = '6px';
                el.style.marginBottom = '6px';
                el.style.background = '#fff';

                el.innerHTML = `
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                    <input type="checkbox" value="${t.id}" data-price="${price}" data-unit="${unitRaw}" data-label="${t.ten}">
                    <div>
                        <div style="font-weight:600;">${t.ten}</div>
                        <div style="font-size:0.82rem; color:#555;">+${formatCurrency(price)} / ${t.donVi}</div>
                    </div>
                </label>
                <div style="display:flex; align-items:center; gap:6px; justify-content:flex-end;">
                    <input id="toppingQty-${t.id}" type="number" min="1" value="1" style="width: 64px; padding: 6px; border: 1px solid var(--border-color); border-radius: 6px; text-align: center;">
                    <span style="font-size:0.85rem; color:#555;">${qtyLabel}</span>
                </div>
            `;

                container.appendChild(el);
            });
        }

        async function selectProduct(prod) {
            if (!prod || !prod.id) return;
            const gocP = Number(prod.gia || 0);
            const sauP = prod.giaSauKhuyenMai != null ? Number(prod.giaSauKhuyenMai) : gocP;
            const unitP = prod.dangKhuyenMai && sauP < gocP ? sauP : gocP;
            currentProduct = { id: prod.id, name: prod.ten, price: unitP };

            document.getElementById('posModalTitle').textContent = 'Tùy chỉnh: ' + (prod.ten || '');
            document.getElementById('posModalProdId').value = prod.id;
            document.getElementById('posIce').value = '100';
            document.getElementById('posQty').value = '1';

            await loadToppingsOnce();
            renderToppings();

            document.getElementById('posModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('posModal').style.display = 'none';
        }

        async function addItemPOS() {
            if (!currentProduct || !currentProduct.id) {
                showMessage('Vui lòng chọn sản phẩm để thêm vào đơn', 'error');
                return;
            }

            const qty = parseInt(document.getElementById('posQty').value, 10) || 1;
            const ice = parseInt(document.getElementById('posIce').value, 10) || 100;

            // ✅ LẤY CHECKBOX
            const toppingInputs = document.querySelectorAll('#posToppings input:checked');

            // ✅ MAP CHUẨN + FILTER NULL
            const selectedToppings = Array.from(toppingInputs)
                .map(input => {
                    const id = input.value;
                    const unit = (input.dataset.unit || '').trim().toLowerCase();
                    const qtyInput = document.getElementById(`toppingQty-${id}`);
                    const rawQty = qtyInput ? parseInt(qtyInput.value, 10) : 1;
                    const validatedQty = Number.isInteger(rawQty) && rawQty > 0 ? rawQty : 1;
                    const needsMultiplier = unit === 'g' || unit === 'ml' || unit.includes('g/ml') || unit.includes('ml/g');
                    const adjustedQty = needsMultiplier ? validatedQty * 10 : validatedQty;

                    if (!id) {
                        console.error("❌ toppingId bị null");
                        return null;
                    }

                    return {
                        nguyenLieuId: id, // UUID dạng string OK
                        soLuong: adjustedQty
                    };
                })
                .filter(t => t !== null);

            console.log("📦 Payload toppings:", selectedToppings); // 🔥 debug

            try {
                const order = await api(
                    'POST',
                    `/api/don-hang/pos/${currentOrderId}/them-san-pham`,
                    {
                        nuocUongId: currentProduct?.id, // ✅ safe access
                        soLuong: qty,
                        tuyChinh: {
                            mucDa: ice
                        },
                        toppings: selectedToppings // ✅ dùng biến mới
                    }
                );

                showMessage('Đã thêm ' + qty + ' ' + currentProduct.name);
                closeModal();
                mapOrderToUI(order);
            } catch (e) {
                if (isPosNeedNewOrderError(e)) {
                    console.error("❌ API ERROR:", e);
                    redirectToPosListNeedNewOrder();
                    return;
                }
                showMessage('Lỗi thêm sản phẩm: ' + e.message, 'error');
                console.error("❌ API ERROR:", e);
            }
        }

        function mapOrderToUI(order) {
            posOrder = (order.chiTietDonHang || []).map(item => ({
                id: item.idChiTietDonHang,
                name: item.tenSanPham,
                price: item.giaTien,
                qty: item.soLuong,
                ice: item.mucDa,
                total: item.thanhTien,

                toppings: (item.toppings || []).map(t => ({
                    name: t.ten,
                    qty: t.soLuong,
                    price: t.giaTien
                }))
            }));

            renderOrder();
            refreshPosTotalsFromOrder(order);
            const couponInp = document.getElementById('posCoupon');
            if (couponInp) {
                couponInp.value = order.maGiamGia || '';
            }
        }

        /** Cập nhật tạm tính / giảm voucher / tổng từ response đơn POS. */
        function refreshPosTotalsFromOrder(order) {
            let tamTinh = 0;
            let giam = 0;
            let tong = 0;
            if (order && order.chiTietDonHang && order.chiTietDonHang.length > 0) {
                tamTinh = order.tamTinhHang != null
                    ? Number(order.tamTinhHang)
                    : (order.chiTietDonHang || []).reduce((s, x) => s + Number(x.thanhTien || 0), 0);
                giam = Number(order.tienGiamApDung || 0);
                tong = Number(order.tongTien != null ? order.tongTien : (tamTinh - giam));
            } else if (order) {
                tamTinh = Number(order.tamTinhHang || 0);
                giam = Number(order.tienGiamApDung || 0);
                tong = Number(order.tongTien != null ? order.tongTien : 0);
            } else {
                tamTinh = posOrder.reduce((sum, item) => sum + Number(item.total || 0), 0);
                giam = 0;
                tong = tamTinh;
            }
            document.getElementById('posSubtotal').textContent = formatCurrency(tamTinh);
            document.getElementById('posDiscount').textContent = '-' + formatCurrency(giam);
            document.getElementById('posTotal').textContent = formatCurrency(tong);
        }

        async function loadOrder() {
            try {
                const order = await api('GET', `/api/don-hang/pos/${currentOrderId}`);

                mapOrderToUI(order);

            } catch (e) {
                showMessage('Lỗi tải đơn: ' + e.message, 'error');
                console.error(e);
            }
        }

        function renderOrder() {
            const container = document.getElementById('posOrder');

            if (posOrder.length === 0) {
                container.innerHTML = '<p class="muted" style="text-align: center;">Chưa có item nào</p>';
                refreshPosTotalsFromOrder(null);
                return;
            }

            container.innerHTML = '';

            posOrder.forEach((item, idx) => {
                const html = `
                <div style="padding: 0.6rem; background: var(--bg-subtle); border-radius: 6px; margin-bottom: 0.6rem;">
                    
                    <div style="display: flex; justify-content: space-between;">
                        <strong style="font-size: 0.95rem;">
                            ${item.name}
                        </strong>
                        <button onclick="removeItem('${item.id}')" 
                            style="background: none; border: none; color: #e74c3c; cursor: pointer;">
                            ✕
                        </button>
                    </div>

                    <small class="muted">${item.qty} x ${formatCurrency(item.price)}</small>

                    <small class="muted" style="display: block;">
                        Đá: ${item.ice != null ? item.ice : '—'}%
                    </small>

                    <div style="display:flex; gap:6px; margin-top:6px;">
                        <button onclick="decreaseQty('${item.id}')" class="btn-secondary" style="margin-top:0; padding:4px 8px;">-</button>
                        <button onclick="increaseQty('${item.id}')" class="btn-secondary" style="margin-top:0; padding:4px 8px;">+</button>
                    </div>

                    ${item.toppings.length > 0
                        ? `<div style="font-size: 0.8rem; color: gray; margin-top: 4px;">
                                + ${item.toppings.map(t => `${t.name} x${t.qty}`).join(', ')}
                            </div>`
                        : ''
                    }

                </div>
            `;

                container.innerHTML += html;
            });
        }

        async function removeItem(chiTietId) {
            try {
                await api('PATCH', `/api/don-hang/pos/chi-tiet/${chiTietId}/xoa`);
                await loadOrder();
            } catch (e) {
                showMessage('Lỗi xóa sản phẩm: ' + e.message, 'error');
            }
        }

        async function increaseQty(chiTietId) {
            try {
                await api('PATCH', `/api/don-hang/pos/chi-tiet/${chiTietId}/tang`);
                await loadOrder();
            } catch (e) {
                showMessage('Lỗi tăng số lượng: ' + e.message, 'error');
            }
        }

        async function decreaseQty(chiTietId) {
            try {
                await api('PATCH', `/api/don-hang/pos/chi-tiet/${chiTietId}/giam`);
                await loadOrder();
            } catch (e) {
                showMessage('Lỗi giảm số lượng: ' + e.message, 'error');
            }
        }

        async function clearOrder() {
            if (confirm('Xóa toàn bộ đơn hàng?')) {
                try {
                    for (const item of posOrder) {
                        await api('PATCH', `/api/don-hang/pos/chi-tiet/${item.id}/xoa`);
                    }
                    await loadOrder();
                } catch (e) {
                    showMessage('Lỗi xóa toàn bộ đơn: ' + e.message, 'error');
                }
            }
        }

        function saveDraftOrder() {
            if (posOrder.length === 0) {
                showMessage('Vui lòng thêm sản phẩm vào đơn');
                return;
            }

            localStorage.setItem('posDraft', JSON.stringify(posOrder));
            showMessage('Lưu nháp thành công!');
        }

        async function confirmOrder() {
            if (posOrder.length === 0) {
                showMessage('Vui lòng thêm sản phẩm vào đơn');
                return;
            }


            try {
                // 🔥 XÁC NHẬN ĐƠN
                await api('PATCH', `/api/don-hang/pos/${currentOrderId}/xac-nhan`);

                showMessage('Đơn hàng đã xác nhận');

                // 🔥 HIỆN CHỌN THANH TOÁN
                showPaymentOptions();

            } catch (e) {
                showMessage('Lỗi xác nhận đơn: ' + e.message, 'error');
                console.error(e);
            }
        }

        async function selectPayment(method) {
            try {
                selectedPaymentMethod = method;

                const payment = await api('POST', `/api/thanh-toan/tao-thanh-toan`, {
                    donHangId: currentOrderId,
                    phuongThuc: method
                });

                // 🔥 LƯU paymentId
                currentPaymentId = payment.id;

                showMessage('Đã chọn: ' + (method === 'TIEN_MAT' ? 'Tiền mặt' : 'MoMo'));

            } catch (e) {
                showMessage('Lỗi tạo thanh toán: ' + e.message, 'error');
                console.error(e);
            }
        }

        function showPaymentOptions() {
            document.getElementById('paymentModal').style.display = 'flex';
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }
        async function confirmPayment() {
            if (!currentPaymentId) {
                showMessage('Chưa tạo thanh toán', 'error');
                return;
            }

            try {
                await api(
                    'PATCH',
                    `/api/thanh-toan/${currentPaymentId}/xac-nhan-thanh-toan`
                );

                showMessage('Thanh toán thành công!');

                closePaymentModal();

                // 🔥 lấy order mới nhất
                const order = await api('GET', `/api/don-hang/pos/${currentOrderId}`);

                showInvoice(order);

            } catch (e) {
                showMessage('Lỗi thanh toán: ' + e.message, 'error');
                console.error(e);
            }
        }

        function showInvoice(order) {
            const container = document.getElementById('invoiceContent');

            let html = '';

            order.chiTietDonHang.forEach(item => {
                html += `
                <div style="margin-bottom:10px;">
                    <strong>${item.tenSanPham}</strong><br>
                    ${item.soLuong} x ${formatCurrency(item.giaTien)}<br>
                    Đá: ${item.mucDa != null ? item.mucDa : '—'}%<br>
                    
                    ${item.toppings?.length > 0
                        ? `<small>+ ${item.toppings.map(t => t.ten).join(', ')}</small>`
                        : ''
                    }
                </div>
            `;
            });

            const tamTinh = order.tamTinhHang != null
                ? Number(order.tamTinhHang)
                : (order.chiTietDonHang || []).reduce((s, x) => s + Number(x.thanhTien || 0), 0);
            const giam = Number(order.tienGiamApDung || 0);
            html += '<hr>';
            if (giam > 0.5) {
                html += `<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>Tạm tính</span><span>${formatCurrency(tamTinh)}</span></div>`;
                html += `<div style="display:flex;justify-content:space-between;margin-bottom:6px;color:#e74c3c;"><span>Giảm giá${order.maGiamGia ? ' (' + escapeHtml(order.maGiamGia) + ')' : ''}</span><span>-${formatCurrency(giam)}</span></div>`;
            }
            html += `<strong>Tổng: ${formatCurrency(order.tongTien)}</strong>`;

            container.innerHTML = html;

            document.getElementById('invoiceModal').style.display = 'flex';
        }

        function closeInvoice() {
            document.getElementById('invoiceModal').style.display = 'none';

            // reset POS
            posOrder = [];
            renderOrder();
            refreshPosTotalsFromOrder(null);
            localStorage.removeItem("currentOrderId");

            // 👉 có thể redirect tạo đơn mới
        }

        async function applyCouponPOS() {
            const raw = document.getElementById('posCoupon').value;
            const code = raw != null ? raw.trim() : '';
            if (!currentOrderId) {
                showMessage('Chưa có đơn hàng', 'error');
                return;
            }
            try {
                const order = await api('PATCH', `/api/don-hang/pos/${currentOrderId}/ma-giam-gia`, { ma: code });
                mapOrderToUI(order);
                showMessage(code ? 'Đã áp dụng mã giảm giá' : 'Đã gỡ mã giảm giá');
            } catch (e) {
                showMessage(e.message || 'Không áp dụng được mã', 'error');
            }
        }

        function showMessage(msg, type = 'success') {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.style.background = type === 'error' ? '#e74c3c' : 'var(--phuclong-green)';
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 2000);
        }

        function formatCurrency(value) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(value || 0);
        }




    </script>

</body>

</html>
