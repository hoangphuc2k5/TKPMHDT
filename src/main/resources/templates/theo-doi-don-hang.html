<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Theo dõi đơn hàng - 4it2run')}"></head>
<body>
<div class="container" style="max-width:760px; padding-top:16px; padding-bottom:24px;">
    <div class="section-card">
        <h2 id="orderCode" style="margin:0 0 6px;">Đơn hàng #------</h2>
        <div class="muted">Theo dõi trạng thái đơn hàng theo thời gian thực.</div>
    </div>

    <div class="section-card">
        <h3 style="margin-top:0;">Tiến trình đơn hàng</h3>
        <div id="orderTimeline"></div>
    </div>

    <div class="section-card">
        <h3 style="margin-top:0;">Chi tiết sản phẩm</h3>
        <div id="orderItems"></div>
    </div>

    <div style="display:flex; gap:10px;">
        <button class="btn-secondary" onclick="lienHeShipper()">Liên hệ shipper</button>
        <button class="btn-secondary" onclick="huyDon()">Hủy đơn</button>
    </div>
</div>

<script>
let currentOrder = null;

document.addEventListener("DOMContentLoaded", loadLatestOrder);

async function loadLatestOrder() {
    try {
        const orders = await api("GET", "/api/don-hang/me");
        if (!orders || !orders.length) {
            document.getElementById("orderItems").innerHTML = "<div class='muted'>Bạn chưa có đơn hàng nào.</div>";
            return;
        }
        currentOrder = orders[0];
        document.getElementById("orderCode").textContent = `Đơn hàng #${String(currentOrder.id).slice(0, 6)}`;
        renderTimeline(currentOrder.trangThaiDb || currentOrder.trangThai);
        renderItems(currentOrder);
    } catch (e) {
        alert("Không thể tải đơn hàng: " + e.message);
    }
}

function renderTimeline(status) {
    const steps = [
        { key: "CHO_XAC_NHAN", label: "Đã đặt hàng" },
        { key: "DA_XAC_NHAN", label: "Đang pha chế" },
        { key: "DANG_GIAO", label: "Đang giao" },
        { key: "DA_GIAO", label: "Hoàn thành" }
    ];
    const orderIndex = Math.max(0, steps.findIndex(x => x.key === status));
    const html = steps.map((step, idx) => `
        <div style="display:flex; gap:10px; align-items:flex-start; margin-bottom:10px;">
            <div style="width:16px; height:16px; border-radius:50%; margin-top:3px; background:${idx <= orderIndex ? 'var(--phuclong-green)' : '#d1d5db'};"></div>
            <div>
                <div style="font-weight:${idx <= orderIndex ? '700' : '500'};">${step.label}</div>
                <div class="muted">${idx <= orderIndex ? new Date().toLocaleTimeString('vi-VN') : '--:--'}</div>
            </div>
        </div>
    `).join("");
    document.getElementById("orderTimeline").innerHTML = html;
}

function renderItems(order) {
    const lines = (order.chiTietDonHangs || order.chiTiet || []);
    if (!lines.length) {
        document.getElementById("orderItems").innerHTML = "<div class='muted'>Không có sản phẩm.</div>";
        return;
    }
    document.getElementById("orderItems").innerHTML = lines.map(item => {
        const tops = item.toppings || [];
        const topLine = tops.length
            ? `<div class="muted" style="margin-top:6px; font-size:0.9rem;"><strong style="color:var(--phuclong-green);">Topping:</strong> ${tops.map(t => {
                const name = t.ten || t.nguyenLieu?.ten || 'Topping';
                const q = t.soLuong != null && t.soLuong > 1 ? ` ×${t.soLuong}` : '';
                return name + q;
            }).join(', ')}</div>`
            : '';
        return `
        <div style="padding:8px 0; border-bottom:1px solid var(--border-color);">
            <strong>${item.nuocUong?.ten || item.tenSanPham || "Sản phẩm"}</strong>
            <div class="muted">Số lượng: ${item.soLuong || 1} | Đá: ${item.tuyChinh?.mucDa ?? "-"}</div>
            <div class="muted">Ghi chú: ${item.tuyChinh?.ghiChu || "Không có"}</div>
            ${topLine}
        </div>`;
    }).join("");
}

function lienHeShipper() {
    alert("Hotline shipper: 1900 1234");
}

async function huyDon() {
    if (!currentOrder) return;
    if (!confirm("Bạn chắc chắn muốn hủy đơn?")) return;
    try {
        await api("POST", `/api/don-hang/${currentOrder.id}/huy`);
        alert("Đơn hàng đã được hủy");
        await loadLatestOrder();
    } catch (e) {
        alert("Không thể hủy đơn: " + e.message);
    }
}
</script>
</body>
</html>
