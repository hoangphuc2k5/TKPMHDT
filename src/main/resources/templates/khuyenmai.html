<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Khuyến mãi - TKPMHDT')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('promotions')}"></header>

<div class="container">
    <div style="margin-bottom: 3rem;">
        <h1 class="brand-font">🎁 Chương Trình Khuyến Mãi</h1>
        <p class="muted">Khám phá các mã giảm giá hấp dẫn và ưu đãi độc quyền</p>
    </div>

    <!-- Tab Navigation -->
    <div style="display: flex; gap: 10px; margin-bottom: 2rem; border-bottom: 2px solid var(--border-color);">
        <button onclick="switchPromoTab('browse')" id="tab-browse-btn" class="tab-btn active" style="padding: 12px 20px; border: none; background: none; cursor: pointer; border-bottom: 3px solid var(--phuclong-green); color: var(--phuclong-green); font-weight: 600;">
            Duyệt ưu đãi
        </button>
        <button onclick="switchPromoTab('check')" id="tab-check-btn" class="tab-btn" style="padding: 12px 20px; border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; color: var(--text-muted); font-weight: 600;">
            Kiểm tra mã
        </button>
        <button sec:authorize="hasAnyRole('QUAN_TRI_VIEN')" onclick="switchPromoTab('manage')" id="tab-manage-btn" class="tab-btn" style="padding: 12px 20px; border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; color: var(--text-muted); font-weight: 600;">
            Quản lý mã
        </button>
    </div>

    <!-- Browse Promotions Tab -->
    <div id="tab-browse" style="display: block;">
        <div id="promosList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2rem;">
            <!-- Promotions will be loaded here -->
        </div>
    </div>

    <!-- Check Code Tab -->
    <div id="tab-check" style="display: none;">
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 2rem;">
            <!-- Check Code Card -->
            <div class="card">
                <div class="card-content">
                    <h3>Kiểm Tra Mã Giảm Giá</h3>
                    <div style="margin-bottom: 1rem;">
                        <label for="checkCode">Nhập mã</label>
                        <input type="text" id="checkCode" placeholder="VD: DRINK50, NOEL2024" style="text-transform: uppercase;">
                    </div>
                    <button onclick="checkPromoCode()" class="btn-highlight" style="width: 100%;">Kiểm tra</button>
                    <div id="checkResult" style="margin-top: 1.5rem; display: none; padding: 1rem; border-radius: 8px; border-left: 4px solid var(--phuclong-green);">
                        <!-- Check result will be displayed here -->
                    </div>
                </div>
            </div>

            <!-- Calculator Card -->
            <div class="card">
                <div class="card-content">
                    <h3>Tính Toán Khuyến Mãi</h3>
                    <div style="margin-bottom: 1rem;">
                        <label for="calcCode">Mã giảm giá</label>
                        <input type="text" id="calcCode" placeholder="Nhập mã..." style="text-transform: uppercase;">
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label for="calcTotal">Tổng đơn hàng (đ)</label>
                        <input type="number" id="calcTotal" placeholder="250000" value="250000" min="0">
                    </div>
                    <button onclick="calculateDiscount()" class="btn-highlight" style="width: 100%;">Tính toán</button>
                    <div id="calcResult" style="margin-top: 1.5rem; display: none; padding: 1rem; border-radius: 8px; background: var(--bg-subtle);">
                        <!-- Calculation result will be displayed here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Manage Tab (Admin Only) -->
    <div id="tab-manage" style="display: none;">
        <div style="margin-bottom: 2rem;">
            <button onclick="showAddPromoForm()" class="btn-highlight" style="padding: 12px 24px;">+ Tạo mã khuyến mãi mới</button>
        </div>

        <!-- Promo List for Admin -->
        <div id="adminPromosList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2rem;">
            <!-- Admin promo list will be loaded here -->
        </div>

        <!-- Add Promo Form -->
        <div id="addPromoForm" class="card" style="margin-top: 2rem; display: none;">
            <div class="card-content">
                <h3>Tạo Mã Khuyến Mãi</h3>
                
                <div style="margin-bottom: 1rem;">
                    <label for="promoCodeInput">Mã code</label>
                    <input type="text" id="promoCodeInput" placeholder="VD: DRINK50" style="text-transform: uppercase;">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="promoType">Loại khuyến mãi</label>
                    <select id="promoType" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px;">
                        <option value="PERCENT">Giảm theo %</option>
                        <option value="FIXED">Giảm số tiền cố định</option>
                    </select>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="promoValue">Giá trị giảm</label>
                    <input type="number" id="promoValue" placeholder="50" min="0">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="promoMinAmount">Tối thiểu đơn hàng (đ)</label>
                    <input type="number" id="promoMinAmount" placeholder="0" value="0" min="0">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="promoMaxCount">Số lần dùng tối đa</label>
                    <input type="number" id="promoMaxCount" placeholder="1000" value="1000" min="0">
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button onclick="cancelPromoForm()" class="btn-secondary" style="flex: 1;">Hủy</button>
                    <button onclick="savePromo()" class="btn-highlight" style="flex: 1;">Tạo mã</button>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', async () => {
        await loadPromotions();
    });

    function switchPromoTab(tabName) {
        // Hide all tabs
        document.querySelectorAll('[id^="tab-"][id$!="btn"]').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.style.color = 'var(--text-muted)';
            btn.style.borderBottomColor = 'transparent';
        });

        // Show selected tab
        document.getElementById('tab-' + tabName).style.display = 'block';
        document.getElementById('tab-' + tabName + '-btn').style.color = 'var(--phuclong-green)';
        document.getElementById('tab-' + tabName + '-btn').style.borderBottomColor = 'var(--phuclong-green)';

        if (tabName === 'manage') loadAdminPromos();
    }

    async function loadPromotions() {
        try {
            // Try to load from API
            const promos = await api('GET', '/api/khuyen-mai') || [];
            const container = document.getElementById('promosList');
            container.innerHTML = '';

            if (promos.length === 0) {
                container.innerHTML = '<p class="muted">Hiện không có ưu đãi nào</p>';
                return;
            }

            promos.forEach(promo => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.position = 'relative';
                
                const isCoupon = promo.loaiGiam === 'PERCENT';
                const badge = isCoupon ? `${promo.giaTriGiam}%` : formatCurrency(promo.giaTriGiam);
                
                card.innerHTML = `
                    <div style="background: linear-gradient(135deg, var(--phuclong-green), var(--phuclong-green-hover)); color: white; padding: 2rem; text-align: center; position: relative;">
                        <div style="font-size: 2.5rem; font-weight: 700; font-family: 'Playfair Display';">${badge}</div>
                        <p style="margin: 0.5rem 0 0; font-size: 0.9rem;">Giảm ${isCoupon ? 'giá' : 'lên đến ' + formatCurrency(promo.giaTriGiam)}</p>
                    </div>
                    <div class="card-content">
                        <h4 style="margin-top: 0; color: var(--phuclong-green);">${promo.ma}</h4>
                        <p class="muted" style="margin: 0.5rem 0;">Tối thiểu: ${formatCurrency(promo.soTienToiThieu)}</p>
                        <p class="muted" style="margin: 0.5rem 0; font-size: 0.85rem;">Còn lại: ${promo.soLanCoTheDung} lần</p>
                        <button onclick="copyCode('${promo.ma}')" class="btn-highlight" style="width: 100%; margin-top: 1rem;">Sao chép mã</button>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (e) {
            console.error('Error loading promotions:', e);
        }
    }

    async function checkPromoCode() {
        const code = document.getElementById('checkCode').value.toUpperCase();
        if (!code) {
            alert('Vui lòng nhập mã giảm giá');
            return;
        }

        try {
            const promo = await api('GET', '/api/khuyen-mai/ma/' + code);
            const resultEl = document.getElementById('checkResult');
            resultEl.style.display = 'block';
            resultEl.style.borderLeftColor = '#16a34a';
            resultEl.innerHTML = `
                <h4 style="margin-top: 0; color: #16a34a;">✓ Mã hợp lệ</h4>
                <p><strong>Loại giảm:</strong> ${promo.loaiGiam === 'PERCENT' ? 'Theo %' : 'Số tiền cố định'}</p>
                <p><strong>Giá trị:</strong> ${promo.loaiGiam === 'PERCENT' ? promo.giaTriGiam + '%' : formatCurrency(promo.giaTriGiam)}</p>
                <p><strong>Tối thiểu đơn:</strong> ${formatCurrency(promo.soTienToiThieu)}</p>
                <p><strong>Còn lại:</strong> ${promo.soLanCoTheDung} lần sử dụng</p>
            `;
        } catch (e) {
            const resultEl = document.getElementById('checkResult');
            resultEl.style.display = 'block';
            resultEl.style.borderLeftColor = '#e74c3c';
            resultEl.style.background = '#fee2e2';
            resultEl.innerHTML = `
                <h4 style="margin-top: 0; color: #e74c3c;">✕ Mã không hợp lệ</h4>
                <p>${e.message || 'Mã này không tồn tại hoặc đã hết hạn'}</p>
            `;
        }
    }

    async function calculateDiscount() {
        const code = document.getElementById('calcCode').value.toUpperCase();
        const total = parseFloat(document.getElementById('calcTotal').value);

        if (!code || !total) {
            alert('Vui lòng điền đầy đủ thông tin');
            return;
        }

        try {
            const result = await api('POST', '/api/khuyen-mai/tinh-tien-giam', {
                ma: code,
                tongTien: total
            });

            const resultEl = document.getElementById('calcResult');
            resultEl.style.display = 'block';
            const discountAmount = Number(result.tienGiam ?? result.giaTriGiam ?? 0);
            const finalTotal = total - discountAmount;
            
            resultEl.innerHTML = `
                <p style="margin: 0 0 0.5rem;"><strong>Tổng tiền:</strong> <span style="color: var(--phuclong-green);">${formatCurrency(total)}</span></p>
                <p style="margin: 0 0 0.5rem;"><strong>Giảm giá:</strong> <span style="color: #e74c3c;">-${formatCurrency(discountAmount)}</span></p>
                <hr style="margin: 0.5rem 0;">
                <p style="margin: 0; font-size: 1.2rem;"><strong>Tổng thanh toán:</strong> <span style="color: var(--phuclong-green); font-size: 1.3rem;">${formatCurrency(finalTotal)}</span></p>
            `;
        } catch (e) {
            const resultEl = document.getElementById('calcResult');
            resultEl.style.display = 'block';
            resultEl.style.background = '#fee2e2';
            resultEl.innerHTML = `<p style="color: #e74c3c; margin: 0;">Lỗi: ${e.message}</p>`;
        }
    }

    function copyCode(code) {
        navigator.clipboard.writeText(code);
        showMessage('Đã sao chép mã: ' + code);
    }

    async function loadAdminPromos() {
        try {
            const promos = await api('GET', '/api/khuyen-mai');
            const container = document.getElementById('adminPromosList');
            container.innerHTML = '';

            promos.forEach(promo => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-content">
                        <h4 style="margin-top: 0;">${promo.ma}</h4>
                        <p><strong>Loại:</strong> ${promo.loaiGiam === 'PERCENT' ? promo.giaTriGiam + '%' : formatCurrency(promo.giaTriGiam)}</p>
                        <p><strong>Tối thiểu:</strong> ${formatCurrency(promo.soTienToiThieu)}</p>
                        <p><strong>Còn lại:</strong> ${promo.soLanCoTheDung}/${promo.soLanToiDa}</p>
                        <button onclick="deletePromo('${promo.id}')" class="btn-secondary" style="width: 100%; color: #e74c3c;">Xóa</button>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (e) {
            console.error('Error loading admin promos:', e);
        }
    }

    function showAddPromoForm() {
        document.getElementById('addPromoForm').style.display = 'block';
    }

    function cancelPromoForm() {
        document.getElementById('addPromoForm').style.display = 'none';
    }

    async function savePromo() {
        const code = document.getElementById('promoCodeInput').value.toUpperCase();
        const type = document.getElementById('promoType').value;
        const value = parseFloat(document.getElementById('promoValue').value);
        const minAmount = parseFloat(document.getElementById('promoMinAmount').value);
        const maxCount = parseInt(document.getElementById('promoMaxCount').value);

        if (!code || !value) {
            alert('Vui lòng điền đầy đủ thông tin');
            return;
        }

        try {
            await api('POST', '/api/khuyen-mai', {
                ma: code,
                loaiGiam: type,
                giaTriGiam: value,
                soTienToiThieu: minAmount,
                soLanToiDa: maxCount
            });

            alert('Tạo mã khuyến mãi thành công!');
            cancelPromoForm();
            await loadAdminPromos();
        } catch (e) {
            alert('Lỗi: ' + e.message);
        }
    }

    function deletePromo(promoId) {
        if (!confirm('Bạn có chắc muốn xóa mã này?')) return;
        alert('Tính năng xóa đang được cập nhật');
    }

    function formatCurrency(value) {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(value || 0);
    }
</script>

</body>
</html>
