<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Lỗi hệ thống')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5" style="max-width: 720px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4">500 - Lỗi hệ thống</h1>
            <p class="text-muted">Có lỗi xảy ra. Vui lòng thử lại sau.</p>
            <details class="small text-muted">
                <summary>Xem chi tiết</summary>
                <pre class="mb-0" th:text="${message}">detail</pre>
            </details>
            <div class="mt-3">
                <a class="btn btn-dark" th:href="@{/}">Về trang chủ</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
