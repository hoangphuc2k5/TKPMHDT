<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chi tiết sản phẩm')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('sanpham')}"></header>

<div class="container" style="padding:2rem 0;">

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem;">

        <!-- LEFT -->
        <div>
            <img id="mainImage"
                 src=""
                 style="width:100%; border-radius:10px;">

            <div id="subImages"
                 style="display:flex; gap:10px; margin-top:1rem;"></div>
        </div>

        <!-- RIGHT -->
        <div>
            <h1 id="sanPhamTen"></h1>
            <p id="sanPhamMoTa"></p>
            <h2 id="sanPhamGia" style="color:green;"></h2>

            <!-- Tùy chỉnh -->
            <div id="tuyChinhContainer"
                 style="display:none; margin-top:2rem; background:#f5f5f5; padding:1rem; border-radius:8px;">

                <h3>Tùy chỉnh sản phẩm</h3>

                <label>Mức đường</label>
                <input type="range" id="mucDuong" min="0" max="100" value="100">
                <small id="mucDuongValue">100%</small>

            <!-- Số lượng và thêm vào giỏ -->
            <div style="margin-bottom: 2rem;">
                <div style="display: grid; grid-template-columns: auto 1fr; gap: 1rem; margin-bottom: 1rem;">
                    <div>
                        <label for="soLuong">Số lượng:</label>
                        <input type="number" id="soLuong" min="1" value="1" style="width: 80px; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 8px;">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <button id="themVaoGioHangBtn" class="btn-primary" style="width: 100%; padding: 1rem; font-size: 1rem;">
                        🛒 Thêm vào giỏ hàng
                    </button>
                    <button id="muaNgayBtn" class="btn-highlight" style="width: 100%; padding: 1rem; font-size: 1rem;">
                        ⚡ Mua ngay
                    </button>
                </div>
            </div>

            <br>

            <label>Số lượng:</label>
            <input type="number" id="soLuong" value="1" min="1">

            <br><br>

            <button id="themVaoGioHangBtn" class="btn-primary">
                Thêm vào giỏ hàng
            </button>
        </div>

    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
const urlParams = new URLSearchParams(window.location.search);
const sanPhamId = urlParams.get("id");

if (!sanPhamId) {
    alert("Không tìm thấy sản phẩm");
} else {
    loadSanPham();
}

async function loadSanPham() {
    try {
        const res = await fetch(`/api/san-pham/nuoc-uong/${sanPhamId}/detail`);

            // Thêm vào giỏ hàng
            document.getElementById('themVaoGioHangBtn').addEventListener('click', themVaoGioHang);
            document.getElementById('muaNgayBtn').addEventListener('click', muaNgay);
        } catch (error) {
            console.error('Lỗi tải sản phẩm:', error);
            showToast('Lỗi tải thông tin sản phẩm', true);
        }

        // ảnh phụ
        const subImages = document.getElementById("subImages");
        subImages.innerHTML = "";

        if (sp.hinhAnh && sp.hinhAnh.length > 1) {
            sp.hinhAnh.forEach(img => {
                const thumb = document.createElement("img");
                thumb.src = img;
                thumb.style.width = "80px";
                thumb.style.height = "80px";
                thumb.style.objectFit = "cover";
                thumb.style.cursor = "pointer";
                thumb.style.borderRadius = "8px";

                thumb.onclick = () => {
                    mainImage.src = img;
                };

                subImages.appendChild(thumb);
            });
        }

        // tùy chỉnh
        if (data.coTheTuyChinh === true) {
            document.getElementById("tuyChinhContainer").style.display = "block";

            const select = document.getElementById("themNguyenLieu");
            select.innerHTML = `<option value="">Chọn topping...</option>`;

            if (data.topping && data.topping.length > 0) {
                data.topping.forEach(t => {
                    const option = document.createElement("option");
                    option.value = t.id;
                    option.textContent = t.ten;
                    select.appendChild(option);
                });
            }
        }

        // button
        document.getElementById("themVaoGioHangBtn").onclick = themVaoGioHang;

    function muaNgay() {
        const soLuong = parseInt(document.getElementById('soLuong').value);
        const mucDuong = parseInt(document.getElementById('mucDuong').value);
        const mucDa = parseInt(document.getElementById('mucDa').value);
        const ghiChu = document.getElementById('ghiChu').value || '';

        const params = new URLSearchParams({
            buyNow: 'true',
            productId: sanPhamId,
            quantity: soLuong.toString(),
            mucDuong: mucDuong.toString(),
            mucDa: mucDa.toString(),
            ghiChu: ghiChu
        });

        window.location.href = '/ui/don-hang?' + params.toString();
    }

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.background = isError ? '#f44336' : '#4caf50';
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
}

function themVaoGioHang() {
    alert("Đã thêm vào giỏ hàng");
}

document.getElementById("mucDuong").addEventListener("input", function(e) {
    document.getElementById("mucDuongValue").textContent = e.target.value + "%";
});

document.getElementById("mucDa").addEventListener("input", function(e) {
    document.getElementById("mucDaValue").textContent = e.target.value + "%";
});
</script>

</body>
</html>
