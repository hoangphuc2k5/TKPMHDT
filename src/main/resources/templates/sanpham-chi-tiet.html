<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Chi tiết sản phẩm')}"></head>

<body>
	<header th:replace="~{fragments/layout :: header('products')}"></header>
	<main class="container product-detail-page" style="max-width:1100px; padding-top:16px; padding-bottom:48px;">
		<div style="display:flex; gap: 32px; flex-wrap: wrap;">
			<div style="flex: 1 1 360px; min-width: 320px; max-width: 520px;">
				<div style="position: relative;">
					<img id="mainImage" src=""
						style="width:100%; max-height:520px; object-fit:cover; border-radius:14px;">
					<button id="prevImageBtn" onclick="changeImage(-1)"
						style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: none;">&#10094;</button>
					<button id="nextImageBtn" onclick="changeImage(1)"
						style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: none;">&#10095;</button>
				</div>
				<div id="subImages" style="display:flex; gap:8px; margin-top:10px; overflow-x:auto;"></div>
			</div>
			<div style="flex: 1 1 360px; min-width: 320px;">
				<div style="margin-bottom:18px;">
					<h1 id="sanPhamTen" style="margin:0;"></h1>
					<div class="muted" id="ratingText" style="margin:8px 0;">⭐ 4.8 (120 đánh giá)</div>
					<p id="sanPhamMoTa" class="muted" style="margin:8px 0;"></p>
					<h2 id="sanPhamGia" style="color:var(--phuclong-green); margin:8px 0;"></h2>
				</div>
				<div class="section-card" style="margin-top:0;">
					<h3 style="margin-top:0;">Công thức gốc</h3>
					<div id="congThucChips" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
				</div>

				<div id="toppingContainer" class="section-card" style="display:none; margin-top:10px;">
					<h3 style="margin-top:0;">Chọn topping</h3>
					<div id="toppingOptions" class="topping-options"></div>
				</div>
				<div id="tuyChinhContainer" class="section-card" style="display:none; margin-top:10px;">
					<h3 style="margin-top:0;">Tùy chỉnh công thức</h3>

					<label>Lượng đá</label>
					<div style="display:flex; gap:8px; align-items:center;">
						<button class="btn-secondary" type="button" style="margin-top:0; padding:6px 10px;"
							onclick="changeRange('mucDa', -10)">-</button>
						<input type="range" id="mucDa" min="0" max="100" value="100" oninput="updateRealtimePrice()">
						<button class="btn-secondary" type="button" style="margin-top:0; padding:6px 10px;"
							onclick="changeRange('mucDa', 10)">+</button>
					</div>
					<small id="mucDaValue">100%</small>

					<label>Ghi chú</label>
					<textarea id="ghiChu" style="width:100%;"
						placeholder="Ví dụ: ít ngọt, không đá viên to..."></textarea>

					<label>Số lượng</label>
					<input type="number" id="soLuong" value="1" min="1" oninput="updateRealtimePrice()">

					<div style="margin-top:10px;">
						<strong>Tạm tính:</strong> <span id="giaTamTinh">0đ</span>
					</div>
					<div id="ingredientAdjustSection" style="margin-top:18px; display:none;">
						<h4 style="margin:0 0 10px; font-size:1rem;">Điều chỉnh nguyên liệu</h4>
						<div class="table-wrap">
							<table id="ingredientAdjustTable" class="data-table"></table>
						</div>
					</div>

					<div id="productAddBar"
						style="margin-top:18px; background:#fff; border:1px solid var(--border-color); border-radius:14px; padding:16px; box-shadow: 0 0 0 1px rgba(0,0,0,.03);">
						<div
							style="display:flex; justify-content:space-between; align-items:center; gap:12px; max-width:760px; margin:0 auto;">
							<div>
								<div class="muted" style="font-size:0.9rem;">Giá hiện tại</div>
								<strong id="fixedPrice">0đ</strong>
							</div>
							<button id="themVaoGioHangBtn" class="btn-highlight" style="margin-top:0; min-width:180px;">Thêm vào giỏ
								hàng</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<script>
		const urlParams = new URLSearchParams(window.location.search);
		const sanPhamId = urlParams.get("id");
		let basePrice = 0;
		let toppings = [];
		let selectedToppingIds = new Set();
		let ingredientAdjustments = [];
		let productImages = [];
		let currentImageIndex = 0;
		const PENDING_CART_KEY = 'pendingAddToCart';
        const PENDING_EDIT_CART_KEY = 'pendingEditCartItem';
        const editCartItemId = urlParams.get("editCartItemId");

        function savePendingCartItem(payload) {
            sessionStorage.setItem(PENDING_CART_KEY, JSON.stringify(payload));
        }

        function savePendingEditCartItem(payload) {
            sessionStorage.setItem(PENDING_EDIT_CART_KEY, JSON.stringify(payload));
        }

        function getPendingEditCartItem() {
            try {
                const raw = sessionStorage.getItem(PENDING_EDIT_CART_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        function clearPendingEditCartItem() {
            sessionStorage.removeItem(PENDING_EDIT_CART_KEY);
        }

        function getPendingCartItem() {
            try {
                const raw = sessionStorage.getItem(PENDING_CART_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        function clearPendingCartItem() {
            sessionStorage.removeItem(PENDING_CART_KEY);
        }

        function redirectToLogin() {
            const currentUrl = window.location.pathname + window.location.search;
            window.location.href = '/login?redirect=' + encodeURIComponent(currentUrl);
        }

        async function processPendingCartItem() {
            const pendingEdit = getPendingEditCartItem();
            if (pendingEdit && pendingEdit.nuocUongId === sanPhamId) {
                try {
                    const me = await api('GET', '/api/nguoi-dung/me');
                    if (me && me.id) {
                        pendingEdit.khachHangId = me.id;
                        await api('PATCH', `/api/gio-hang/${me.id}/mat-hang/${pendingEdit.editCartItemId}`, pendingEdit);
                        clearPendingEditCartItem();
                        alert('Đã tự động cập nhật sản phẩm trong giỏ hàng sau khi đăng nhập.');
                    }
                } catch (e) {
                    console.warn('Không thể tự động cập nhật sản phẩm trong giỏ hàng:', e);
                }
                return;
            }

            const pending = getPendingCartItem();
            if (!pending || pending.nuocUongId !== sanPhamId) {
                return;
            }

            try {
                const me = await api('GET', '/api/nguoi-dung/me');
                if (me && me.id) {
                    pending.khachHangId = me.id;
                }
                await api('POST', '/api/gio-hang/them-mat-hang', pending);
                clearPendingCartItem();
                alert('Đã tự động thêm sản phẩm vào giỏ hàng sau khi đăng nhập.');
            } catch (e) {
                console.warn('Không thể tự động thêm vào giỏ hàng:', e);
            }
        }

        function processPendingEditCartItem() {
            const pending = getPendingEditCartItem();
            if (!pending || pending.nuocUongId !== sanPhamId) {
                return;
            }
            if (pending.soLuong != null) {
                document.getElementById("soLuong").value = pending.soLuong;
            }
            if (pending.mucDa != null) {
                document.getElementById("mucDa").value = pending.mucDa;
            }
            if (pending.ghiChu != null) {
                document.getElementById("ghiChu").value = pending.ghiChu;
            }
            selectedToppingIds = new Set(
                Array.isArray(pending.toppings)
                    ? pending.toppings.map(t => t.toppingId || t.nguyenLieuId).filter(Boolean)
                    : []
            );
            updateToppingSelectionUI();
            updateRealtimePrice();
        }

        if (!sanPhamId) {
            alert("Không tìm thấy sản phẩm");
        } else {
            loadSanPham();
        }

		function changeImage(direction) {
			if (productImages.length <= 1) return;
			currentImageIndex = (currentImageIndex + direction + productImages.length) % productImages.length;
			document.getElementById("mainImage").src = productImages[currentImageIndex];
			updateNavigationButtons();
		}

		function updateNavigationButtons() {
			const prevBtn = document.getElementById("prevImageBtn");
			const nextBtn = document.getElementById("nextImageBtn");
			if (productImages.length > 1) {
				prevBtn.style.display = "block";
				nextBtn.style.display = "block";
			} else {
				prevBtn.style.display = "none";
				nextBtn.style.display = "none";
			}
		}

		async function loadSanPham() {
			try {
				const res = await fetch(`/api/san-pham/nuoc-uong/${sanPhamId}/detail`);

				if (!res.ok) {
					throw new Error("Không tải được sản phẩm");
				}

				const data = await res.json();
				const sp = data.sanPham;
				const formula = data.congThuc || sp.congThucCoBan;
				if (formula) {
					sp.congThuc = formula;
					sp.congThucCoBan = formula;
				}

				// tên
				document.getElementById("sanPhamTen").textContent = sp.ten;

				// mô tả
				document.getElementById("sanPhamMoTa").textContent =
					sp.moTa || "Không có mô tả";

				const gocKm = Number(data.giaGocKhuyenMai != null ? data.giaGocKhuyenMai : sp.gia || 0);
				const sauKm = data.giaSauKhuyenMai != null ? Number(data.giaSauKhuyenMai) : gocKm;
				const coKm = data.coKhuyenMaiGia === true && sauKm < gocKm;
				basePrice = coKm ? sauKm : gocKm;
				const nhanKm = data.nhanKhuyenMaiGia || "Khuyến mãi";
				const fmtVnd = (v) => new Intl.NumberFormat("vi-VN", { style: "currency", currency: "VND" }).format(v || 0);
				const giaEl = document.getElementById("sanPhamGia");
				if (coKm) {
					giaEl.innerHTML = `<span style="text-decoration:line-through; color:#888; font-size:1rem; margin-right:10px;">${fmtVnd(gocKm)}</span>`
						+ `<span style="color:var(--phuclong-green);">${fmtVnd(sauKm)}</span>`
						+ ` <span class="chip pending" style="margin-left:10px; font-size:0.85rem; vertical-align:middle;">${escapeHtmlProduct(nhanKm)}</span>`
						+ ` <span class="chip pending" style="font-size:0.85rem; vertical-align:middle; background:#0C713D; color:#fff; border-color:#0C713D;">Giảm giá</span>`;
				} else {
					giaEl.textContent = fmtVnd(basePrice);
				}

				// ảnh chính
				productImages = sp.hinhAnh || [];
				const mainImage = document.getElementById("mainImage");
				if (productImages.length > 0) {
					mainImage.src = productImages[0];
				} else {
					mainImage.src = "/uploads/default-drink.jpg";
				}

				// ảnh phụ
				const subImages = document.getElementById("subImages");
				subImages.innerHTML = "";

				if (productImages.length > 1) {
					productImages.forEach((img, index) => {
						const thumb = document.createElement("img");
						thumb.src = img;
						thumb.style.width = "80px";
						thumb.style.height = "80px";
						thumb.style.objectFit = "cover";
						thumb.style.cursor = "pointer";
						thumb.style.borderRadius = "8px";
						thumb.style.border = index === 0 ? "2px solid var(--phuclong-green)" : "2px solid transparent";

						thumb.onclick = () => {
							currentImageIndex = index;
							mainImage.src = img;
							updateThumbnailBorders();
						};

						subImages.appendChild(thumb);
					});
				}

				updateNavigationButtons();
				renderCongThucGocTuDb(data);
				renderToppingOptions(data.topping);
				initIngredientAdjustments(data);

				// tùy chỉnh
				if (data.coTheTuyChinh === true) {
					document.getElementById("tuyChinhContainer").style.display = "block";
				}

				// button
				document.getElementById("themVaoGioHangBtn").onclick = themVaoGioHang;
				document.getElementById("themVaoGioHangBtn").textContent = editCartItemId ? 'Cập nhật sản phẩm' : 'Thêm vào giỏ hàng';
				updateRealtimePrice();
				processPendingEditCartItem();
				processPendingCartItem();

			} catch (error) {
				console.error(error);
				alert("Lỗi tải chi tiết sản phẩm");
			}
		}

		function updateThumbnailBorders() {
			const thumbnails = document.querySelectorAll("#subImages img");
			thumbnails.forEach((thumb, index) => {
				thumb.style.border = index === currentImageIndex ? "2px solid var(--phuclong-green)" : "2px solid transparent";
			});
		}

		async function themVaoGioHang() {
			const payload = {
				nuocUongId: sanPhamId,
				soLuong: Number(document.getElementById("soLuong").value || 1),
				mucDa: Number(document.getElementById("mucDa").value || 100),
				ghiChu: document.getElementById("ghiChu").value || null,
				toppings: getSelectedToppingsPayload()
			};

		let me;
		try {
			me = await api("GET", "/api/nguoi-dung/me");
			if (!me || !me.id) {
				throw new Error('Unauthenticated');
			}
			payload.khachHangId = me.id;
		} catch (e) {
			if (editCartItemId) {
				savePendingEditCartItem({ ...payload, editCartItemId });
			} else {
				savePendingCartItem(payload);
			}
			redirectToLogin();
			return;
		}

		try {
			if (editCartItemId) {
				await api("PATCH", `/api/gio-hang/${me.id}/mat-hang/${editCartItemId}`, payload);
			} else {
				await api("POST", "/api/gio-hang/them-mat-hang", payload);
			}
			clearPendingCartItem();
			clearPendingEditCartItem();
			alert(editCartItemId ? "Đã cập nhật sản phẩm trong giỏ hàng" : "Đã thêm vào giỏ hàng");
		} catch (e) {
			alert("Không thể thêm vào giỏ hàng: " + (e.message || e));
		}
	}

	function changeRange(field, delta) {
		const input = document.getElementById(field);
		if (!input) return;
		const current = Number(input.value || 0);
		const min = Number(input.min || 0);
		const max = Number(input.max || 100);
		const next = Math.min(max, Math.max(min, current + delta));
		input.value = next;
		updateRealtimePrice();
	}

	function updateRealtimePrice() {
		const da = Number(document.getElementById("mucDa").value || 100);
		const qty = Math.max(1, Number(document.getElementById("soLuong").value || 1));

		const ingredientDelta = ingredientAdjustments.reduce((sum, row) => {
			const ratio = Number(document.getElementById(`ing-${row.key}`)?.value || 100);
			const delta = Math.max(0, ratio - 100) / 100;
			const deltaMoney = row.unitPrice * delta;
			const priceCell = document.getElementById(`ing-price-${row.key}`);
			if (priceCell) {
				priceCell.textContent = "+" + formatPrice(deltaMoney);
			}
			return sum + deltaMoney;
		}, 0);

		const toppingTotalPerUnit = toppings.reduce((sum, item) => {
			const unitPrice = Number(item.giaDonVi || item.gia || item.giaThem || 5000);
			return sum + (selectedToppingIds.has(item.id) ? unitPrice : 0);
		}, 0);

		document.getElementById("mucDaValue").textContent = da + "%";

		// Công thức giá: hệ số tăng nhẹ nếu đá nhiều hơn 100% (tùy chỉnh)
		const heSo = 1 + Math.max(0, (da - 100) / 250);
		const one = (basePrice * heSo) + ingredientDelta + toppingTotalPerUnit;
		const total = one * qty;
		document.getElementById("giaTamTinh").textContent = formatPrice(total);
		document.getElementById("fixedPrice").textContent = formatPrice(total);
	}

	function getSelectedToppingsPayload() {
		return toppings
			.filter(item => selectedToppingIds.has(item.id))
			.map(item => ({
				nguyenLieuId: item.id,
				ten: item.ten,
				giaThem: Number(item.giaDonVi || item.giaThem || 0),
				soLuong: 1
			}));
	}

	function renderToppingOptions(data) {
		toppings = Array.isArray(data) ? data.filter(item => item && item.id) : [];
		const wrap = document.getElementById('toppingOptions');
		if (!wrap) return;
		selectedToppingIds = new Set();
		if (!toppings.length) {
			wrap.innerHTML = '<span class="muted">Không có topping cho sản phẩm này.</span>';
			document.getElementById('toppingContainer').style.display = 'block';
			return;
		}

		wrap.innerHTML = toppings.map((item) => {
			const price = Number(item.giaDonVi || item.giaThem || 0);
			return `
			<label class="topping-item" for="topping-${item.id}">
				<input type="checkbox" id="topping-${item.id}" value="${item.id}" onchange="toggleTopping('${item.id}')">
				<span>${item.ten}</span>
				<small>+${formatPrice(price)}</small>
			</label>
			`;
		}).join('');
		document.getElementById('toppingContainer').style.display = 'block';
	}

	function toggleTopping(id) {
		if (!id) return;
		if (selectedToppingIds.has(id)) {
			selectedToppingIds.delete(id);
		} else {
			selectedToppingIds.add(id);
		}
		updateToppingSelectionUI();
		updateRealtimePrice();
	}

	function updateToppingSelectionUI() {
		toppings.forEach((item) => {
			const checkbox = document.getElementById(`topping-${item.id}`);
			const label = checkbox ? checkbox.closest('.topping-item') : null;
			if (checkbox) {
				checkbox.checked = selectedToppingIds.has(item.id);
			}
			if (label) {
				label.classList.toggle('selected', selectedToppingIds.has(item.id));
			}
		});
	}

	function initIngredientAdjustments(data) {
		const rows = [];
		if (Array.isArray(data.nguyenLieu)) {
			data.nguyenLieu
				.filter((x) => x.loaiNguyenLieu !== 'TOPPING')
				.forEach((x, index) => {
				rows.push({
					key: index,
					ten: x.ten || x.tenNguyenLieu || `Nguyên liệu ${index + 1}`,
					soLuong: x.soLuong != null ? x.soLuong : '',
					donVi: x.donVi || '',
					unitPrice: Number(x.donGia || 0)
				});
			});
		}
		ingredientAdjustments = rows;
		const section = document.getElementById("ingredientAdjustSection");
		const table = document.getElementById("ingredientAdjustTable");
		if (!table || !section) {
			return;
		}
		section.style.display = rows.length ? 'block' : 'none';
		if (!rows.length) {
			table.innerHTML = "<tr><td colspan='3' class='muted'>Chưa có công thức nguyên liệu để tùy chỉnh.</td></tr>";
			return;
		}
		table.innerHTML = rows.map((row) => `
        <tr>
            <td style="padding:6px 0;">${row.ten}<br><small class='muted'>${row.soLuong} ${row.donVi}</small></td>
            <td style="padding:6px 0;">
                <input id="ing-${row.key}" type="range" min="50" max="150" value="100" oninput="updateRealtimePrice()">
            </td>
            <td id="ing-price-${row.key}" style="padding:6px 0; text-align:right;">+0đ</td>
        </tr>
    `).join("");
	}

	function escapeHtmlProduct(s) {
			if (s == null) return '';
			const d = document.createElement('div');
			d.textContent = String(s);
			return d.innerHTML;
		}

		/** Công thức gốc: chỉ từ DB (data.congThuc + data.nguyenLieu do backend build từ luong_nguyen_lieu). */
		function renderCongThucGocTuDb(data) {
			const wrap = document.getElementById("congThucChips");
			if (!wrap) return;

			const ct = data.congThuc;
			let meta = '';
			if (ct && (ct.ten || ct.moTa)) {
				const title = ct.ten ? escapeHtmlProduct(ct.ten) : '';
				const desc = ct.moTa ? escapeHtmlProduct(ct.moTa) : '';
				meta = `<div class="muted" style="margin-bottom:10px;line-height:1.45;">`
					+ (title ? `<strong>${title}</strong>` : '')
					+ (title && desc ? '<br>' : '')
					+ (desc ? `<span style="font-weight:400;">${desc}</span>` : '')
					+ `</div>`;
			}

			const lines = Array.isArray(data.nguyenLieu) ? data.nguyenLieu : [];
			const isPhaChe = (row) => row.loaiNguyenLieu !== 'TOPPING';

			const chipRows = lines.filter(isPhaChe);
			const chipsHtml = chipRows.length
				? chipRows.map((x) => {
					const name = (x.ten || x.tenNguyenLieu || '').trim() || 'Nguyên liệu';
					const qty = x.soLuong != null && x.soLuong !== '' ? String(x.soLuong).trim() : '';
					const unit = (x.donVi || '').trim();
					const qtyPart = [qty, unit].filter(Boolean).join(' ');
					const label = qtyPart ? `${name} — ${qtyPart}` : name;
					return `<span class="chip pending">${escapeHtmlProduct(label)}</span>`;
				}).join('')
				: '';

			if (!meta && !chipsHtml) {
				wrap.innerHTML = '<span class="muted">Chưa có công thức gốc trong cơ sở dữ liệu (cấu hình công thức cho sản phẩm).</span>';
				return;
			}

			wrap.innerHTML = meta + (chipsHtml || '<span class="muted">Chưa có dòng định lượng pha chế trong công thức.</span>');
		}

		function formatPrice(value) {
			return new Intl.NumberFormat("vi-VN", {style: "currency", currency: "VND"}).format(value || 0);
		}
	</script>

	<div class="product-detail-footer-wrap">
		<footer th:replace="~{fragments/layout :: footer}"></footer>
	</div>
</body>

</html>
