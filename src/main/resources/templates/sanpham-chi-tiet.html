<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Chi tiết sản phẩm')}"></head>

<body>
	<header th:replace="~{fragments/layout :: header('products')}"></header>
	<div class="container" style="max-width:1100px; padding-top:16px; padding-bottom:100px;">
		<div style="display:flex; gap: 32px; flex-wrap: wrap;">
			<div style="flex: 1 1 360px; min-width: 320px; max-width: 520px;">
				<div style="position: relative;">
					<img id="mainImage" src=""
						style="width:100%; max-height:520px; object-fit:cover; border-radius:14px;">
					<button id="prevImageBtn" onclick="changeImage(-1)"
						style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: none;">&#10094;</button>
					<button id="nextImageBtn" onclick="changeImage(1)"
						style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: none;">&#10095;</button>
				</div>
				<div id="subImages" style="display:flex; gap:8px; margin-top:10px; overflow-x:auto;"></div>
			</div>
			<div style="flex: 1 1 360px; min-width: 320px;">
				<div style="margin-bottom:18px;">
					<h1 id="sanPhamTen" style="margin:0;"></h1>
					<div class="muted" id="ratingText" style="margin:8px 0;">⭐ 4.8 (120 đánh giá)</div>
					<p id="sanPhamMoTa" class="muted" style="margin:8px 0;"></p>
					<h2 id="sanPhamGia" style="color:var(--phuclong-green); margin:8px 0;"></h2>
				</div>
				<div class="section-card" style="margin-top:0;">
					<h3 style="margin-top:0;">Công thức gốc</h3>
					<div id="congThucChips" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
				</div>

				<div id="tuyChinhContainer" class="section-card" style="display:none; margin-top:10px;">
					<h3 style="margin-top:0;">Tùy chỉnh công thức</h3>

					<!-- ĐÃ XÓA PHẦN "LƯỢNG ĐƯỜNG" THEO YÊU CẦU -->

					<label>Lượng đá</label>
					<div style="display:flex; gap:8px; align-items:center;">
						<button class="btn-secondary" type="button" style="margin-top:0; padding:6px 10px;"
							onclick="changeRange('mucDa', -10)">-</button>
						<input type="range" id="mucDa" min="0" max="100" value="100" oninput="updateRealtimePrice()">
						<button class="btn-secondary" type="button" style="margin-top:0; padding:6px 10px;"
							onclick="changeRange('mucDa', 10)">+</button>
					</div>
					<small id="mucDaValue">100%</small>

					<div style="margin-top:12px;">
						<label>Bảng định lượng nguyên liệu (±50%)</label>
						<table style="width:100%; border-collapse: collapse;">
							<thead>
								<tr>
									<th style="text-align:left; font-size:0.85rem;">Nguyên liệu</th>
									<th style="text-align:left; font-size:0.85rem;">Tỉ lệ</th>
									<th style="text-align:right; font-size:0.85rem;">Ảnh hưởng giá</th>
								</tr>
							</thead>
							<tbody id="ingredientAdjustTable"></tbody>
						</table>
					</div>

					<label>Ghi chú</label>
					<textarea id="ghiChu" style="width:100%;"
						placeholder="Ví dụ: ít ngọt, không đá viên to..."></textarea>

					<label>Số lượng</label>
					<input type="number" id="soLuong" value="1" min="1" oninput="updateRealtimePrice()">

					<div style="margin-top:10px;">
						<strong>Tạm tính:</strong> <span id="giaTamTinh">0đ</span>
					</div>
				</div>
			</div>
		</div>

		<div id="productAddBar"
			style="margin-top:18px; background:#fff; border:1px solid var(--border-color); border-radius:14px; padding:16px; box-shadow: 0 0 0 1px rgba(0,0,0,.03);">
			<div
				style="display:flex; justify-content:space-between; align-items:center; gap:12px; max-width:760px; margin:0 auto;">
				<div>
					<div class="muted" style="font-size:0.9rem;">Giá hiện tại</div>
					<strong id="fixedPrice">0đ</strong>
				</div>
				<button id="themVaoGioHangBtn" class="btn-highlight" style="margin-top:0; min-width:180px;">Thêm vào giỏ
					hàng</button>
			</div>
		</div>
	</div>

	<script>
		const urlParams = new URLSearchParams(window.location.search);
		const sanPhamId = urlParams.get("id");
		let basePrice = 0;
		let toppings = [];
		let ingredientAdjustments = [];
		const PENDING_CART_KEY = 'pendingAddToCart';

		function savePendingCartItem(payload) {
			sessionStorage.setItem(PENDING_CART_KEY, JSON.stringify(payload));
		}

		function getPendingCartItem() {
			try {
				const raw = sessionStorage.getItem(PENDING_CART_KEY);
				return raw ? JSON.parse(raw) : null;
			} catch (e) {
				return null;
			}
		}

		function clearPendingCartItem() {
			sessionStorage.removeItem(PENDING_CART_KEY);
		}

		function redirectToLogin() {
			const currentUrl = window.location.pathname + window.location.search;
			window.location.href = '/login?redirect=' + encodeURIComponent(currentUrl);
		}

		async function processPendingCartItem() {
			const pending = getPendingCartItem();
			if (!pending || pending.nuocUongId !== sanPhamId) {
				return;
			}

			try {
				const me = await api('GET', '/api/nguoi-dung/me');
				if (me && me.id) {
					pending.khachHangId = me.id;
				}
				await api('POST', '/api/gio-hang/them-mat-hang', pending);
				clearPendingCartItem();
				alert('Đã tự động thêm sản phẩm vào giỏ hàng sau khi đăng nhập.');
			} catch (e) {
				console.warn('Không thể tự động thêm vào giỏ hàng:', e);
			}
		}

		if (!sanPhamId) {
			alert("Không tìm thấy sản phẩm");
		} else {
			loadSanPham();
		}

		let currentImageIndex = 0;
		let productImages = [];

		function changeImage(direction) {
			if (productImages.length <= 1) return;
			currentImageIndex = (currentImageIndex + direction + productImages.length) % productImages.length;
			document.getElementById("mainImage").src = productImages[currentImageIndex];
			updateNavigationButtons();
		}

		function updateNavigationButtons() {
			const prevBtn = document.getElementById("prevImageBtn");
			const nextBtn = document.getElementById("nextImageBtn");
			if (productImages.length > 1) {
				prevBtn.style.display = "block";
				nextBtn.style.display = "block";
			} else {
				prevBtn.style.display = "none";
				nextBtn.style.display = "none";
			}
		}

		async function loadSanPham() {
			try {
				const res = await fetch(`/api/san-pham/nuoc-uong/${sanPhamId}/detail`);

				if (!res.ok) {
					throw new Error("Không tải được sản phẩm");
				}

				const data = await res.json();
				const sp = data.sanPham;
				const formula = data.congThuc || sp.congThucCoBan;
				if (formula) {
					sp.congThuc = formula;
					sp.congThucCoBan = formula;
				}

				// tên
				document.getElementById("sanPhamTen").textContent = sp.ten;

				// mô tả
				document.getElementById("sanPhamMoTa").textContent =
					sp.moTa || "Không có mô tả";

				basePrice = Number(sp.gia || 0);
				document.getElementById("sanPhamGia").textContent =
					new Intl.NumberFormat("vi-VN", {
						style: "currency",
						currency: "VND"
					}).format(basePrice);

				// ảnh chính
				productImages = sp.hinhAnh || [];
				const mainImage = document.getElementById("mainImage");
				if (productImages.length > 0) {
					mainImage.src = productImages[0];
				} else {
					mainImage.src = "/uploads/default-drink.jpg";
				}

				// ảnh phụ
				const subImages = document.getElementById("subImages");
				subImages.innerHTML = "";

				if (productImages.length > 1) {
					productImages.forEach((img, index) => {
						const thumb = document.createElement("img");
						thumb.src = img;
						thumb.style.width = "80px";
						thumb.style.height = "80px";
						thumb.style.objectFit = "cover";
						thumb.style.cursor = "pointer";
						thumb.style.borderRadius = "8px";
						thumb.style.border = index === 0 ? "2px solid var(--phuclong-green)" : "2px solid transparent";

						thumb.onclick = () => {
							currentImageIndex = index;
							mainImage.src = img;
							updateThumbnailBorders();
						};

						subImages.appendChild(thumb);
					});
				}

				updateNavigationButtons();
				renderCongThucChips(data, sp, formula);
				initIngredientAdjustments(data);

				// tùy chỉnh
				if (data.coTheTuyChinh === true) {
					document.getElementById("tuyChinhContainer").style.display = "block";
				}

				// button
				document.getElementById("themVaoGioHangBtn").onclick = themVaoGioHang;
				updateRealtimePrice();
				processPendingCartItem();

			} catch (error) {
				console.error(error);
				alert("Lỗi tải chi tiết sản phẩm");
			}
		}

		function updateThumbnailBorders() {
			const thumbnails = document.querySelectorAll("#subImages img");
			thumbnails.forEach((thumb, index) => {
				thumb.style.border = index === currentImageIndex ? "2px solid var(--phuclong-green)" : "2px solid transparent";
			});
		}

		async function themVaoGioHang() {
			const payload = {
				nuocUongId: sanPhamId,
				soLuong: Number(document.getElementById("soLuong").value || 1),
				mucDuong: 100,  // giữ mặc định 100% vì UI không còn hiển thị điều chỉnh
				mucDa: Number(document.getElementById("mucDa").value || 100),
				ghiChu: document.getElementById("ghiChu").value || null
			};

			try {
				const me = await api("GET", "/api/nguoi-dung/me");
				if (!me || !me.id) {
					throw new Error('Unauthenticated');
				}
				payload.khachHangId = me.id;
			} catch (e) {
				savePendingCartItem(payload);
				redirectToLogin();
				return;
			}

			try {
				await api("POST", "/api/gio-hang/them-mat-hang", payload);
				clearPendingCartItem();
				alert("Đã thêm vào giỏ hàng");
			} catch (e) {
				alert("Không thể thêm vào giỏ hàng: " + (e.message || e));
			}
		}

		function changeRange(inputId, step) {
			const input = document.getElementById(inputId);
			const current = Number(input.value || 0);
			input.value = Math.max(0, Math.min(100, current + step));
			updateRealtimePrice();
		}

		function updateRealtimePrice() {
			// Do UI không còn hiển thị mucDuong, ta mặc định dùng 100%
			const duong = 100;
			const da = Number(document.getElementById("mucDa").value || 100);
			const qty = Math.max(1, Number(document.getElementById("soLuong").value || 1));

			const ingredientDelta = ingredientAdjustments.reduce((sum, row) => {
				const ratio = Number(document.getElementById(`ing-${row.key}`)?.value || 100);
				const delta = Math.max(0, ratio - 100) / 100;
				const deltaMoney = row.unitPrice * delta;
				const priceCell = document.getElementById(`ing-price-${row.key}`);
				if (priceCell) {
					priceCell.textContent = "+" + formatPrice(deltaMoney);
				}
				return sum + deltaMoney;
			}, 0);

			document.getElementById("mucDaValue").textContent = da + "%";

			// Công thức giá: hệ số tăng nhẹ nếu đá nhiều hơn 100% (tùy chỉnh)
			const heSo = 1 + Math.max(0, (da - 100) / 250);
			const one = (basePrice * heSo) + ingredientDelta;
			const total = one * qty;
			document.getElementById("giaTamTinh").textContent = formatPrice(total);
			document.getElementById("fixedPrice").textContent = formatPrice(total);
		}

		function initIngredientAdjustments(data) {
			const rows = [];
			if (Array.isArray(data.nguyenLieu)) {
				data.nguyenLieu.forEach((x, index) => {
					rows.push({
						key: index,
						ten: x.ten || x.tenNguyenLieu || `Nguyên liệu ${index + 1}`,
						soLuong: x.soLuong != null ? x.soLuong : '',
						donVi: x.donVi || '',
						unitPrice: Number(x.donGia || 0)
					});
				});
			}
			ingredientAdjustments = rows;
			const table = document.getElementById("ingredientAdjustTable");
			if (!rows.length) {
				table.innerHTML = "<tr><td colspan='3' class='muted'>Chưa có công thức nguyên liệu để tùy chỉnh.</td></tr>";
				return;
			}
			table.innerHTML = rows.map((row) => `
        <tr>
            <td style="padding:6px 0;">${row.ten}<br><small class='muted'>${row.soLuong} ${row.donVi}</small></td>
            <td style="padding:6px 0;">
                <input id="ing-${row.key}" type="range" min="50" max="150" value="100" oninput="updateRealtimePrice()">
            </td>
            <td id="ing-price-${row.key}" style="padding:6px 0; text-align:right;">+0đ</td>
        </tr>
    `).join("");
		}

		function renderCongThucChips(data, sp, formula) {
			const chips = [];
			if (Array.isArray(data.nguyenLieu)) {
				data.nguyenLieu.forEach(x => chips.push(x.ten));
			}
			if (Array.isArray(sp.nguyenLieuSuDung)) {
				sp.nguyenLieuSuDung.forEach(x => chips.push(x.ten));
			}
			if (formula && Array.isArray(formula.luongNguyenLieus)) {
				formula.luongNguyenLieus.forEach(x => {
					const name = x.ten || x.tenNguyenLieu || (x.nguyenLieu ? x.nguyenLieu.ten : null);
					chips.push(name);
				});
			}
			const unique = Array.from(new Set(chips.filter(Boolean)));
			const wrap = document.getElementById("congThucChips");
			if (!unique.length) {
				wrap.innerHTML = "<span class='muted'>Chưa có dữ liệu công thức.</span>";
				return;
			}
			wrap.innerHTML = unique.map(name => `<span class="chip pending">${name}</span>`).join("");
		}

		function formatPrice(value) {
			return new Intl.NumberFormat("vi-VN", {style: "currency", currency: "VND"}).format(value || 0);
		}
	</script>

	<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
