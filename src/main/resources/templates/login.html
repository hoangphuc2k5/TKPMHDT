<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng nhập - TKPMHDT')}"></head>
<body class="auth-page">
<div class="auth-shell">
    <a th:href="@{/}" class="auth-brand" style="text-decoration: none; color: inherit; display: inline-flex; align-items: center; gap: 12px;">
        <div style="font-size:34px;">🥤</div>
        <div class="brand-font" style="font-size:2rem;">DrinkHub</div>
    </a>

    <div class="auth-tabs">
        <a class="auth-tab active" th:href="@{/login}">Đăng nhập</a>
        <a class="auth-tab" th:href="@{/register}">Đăng ký</a>
    </div>

    <div class="section-card">
        <form method="post" th:action="@{/login}" style="text-align: left;">
            <label>Số điện thoại hoặc email</label>
            <input type="text" name="username" placeholder="Nhập số điện thoại hoặc email..." required autofocus>

            <label>Mật khẩu</label>
            <div class="password-field-wrap">
                <input id="loginPassword" type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                <button type="button" class="password-toggle-btn" onclick="togglePassword('loginPassword', this)" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button>
            </div>

            <button type="submit" style="width:100%; font-weight:700;">Đăng nhập</button>
            <input type="hidden" name="redirect" id="redirectField" value="">
        </form>

        <div style="margin-top: 10px;">
            <a th:href="@{/quen-mat-khau}" style="color: var(--phuclong-green); text-decoration: none; font-size: 0.9rem;">Quên mật khẩu?</a>
        </div>

        <div class="muted" style="text-align:center; margin:14px 0 10px;">Hoặc đăng nhập bằng</div>
       
        <div th:if="${param.error}" style="margin-top: 1rem; padding: 0.8rem; border-radius: 8px; background: #fee2e2; color: #991b1b; font-size: 0.875rem;">
            Sai tài khoản hoặc mật khẩu.
        </div>
        <div th:if="${param.logout}" style="margin-top: 1rem; padding: 0.8rem; border-radius: 8px; background: #dcfce7; color: #166534; font-size: 0.875rem;">
            Đăng xuất thành công.
        </div>
    </div>

    <div style="text-align:center; margin-top: 14px;">
        <span class="muted">Chưa có tài khoản? </span>
        <a th:href="@{/register}" style="color: var(--phuclong-green); text-decoration: none; font-weight: 600;">Đăng ký ngay</a>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const redirectTarget = params.get('redirect');
    if (redirectTarget) {
        const redirectField = document.getElementById('redirectField');
        if (redirectField) {
            redirectField.value = redirectTarget;
        }
    }
</script>
</body>
</html>
