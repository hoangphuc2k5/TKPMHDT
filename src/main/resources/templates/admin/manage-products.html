<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Quản lý Sản phẩm - TKPMHDT')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('admin')}"></header>

<div class="container">
    <div style="margin-bottom: 2rem;">
        <h1 class="brand-font">Quản Lý Sản Phẩm</h1>
        <p class="muted">Thêm, sửa, xóa đồ uống và quản lý nguyên liệu</p>
    </div>

    <!-- Tab Navigation -->
    <div style="display: flex; gap: 10px; margin-bottom: 2rem; border-bottom: 2px solid var(--border-color);">
        <button onclick="switchTab('products')" id="tab-products-btn" class="tab-btn active" style="padding: 12px 20px; border: none; background: none; cursor: pointer; border-bottom: 3px solid var(--phuclong-green); color: var(--phuclong-green); font-weight: 600;">
            📋 Danh sách sản phẩm
        </button>
        <button onclick="switchTab('ingredients')" id="tab-ingredients-btn" class="tab-btn" style="padding: 12px 20px; border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; color: var(--text-muted); font-weight: 600;">
            🧪 Nguyên liệu
        </button>
    </div>

    <!-- PRODUCTS TAB -->
    <div id="tab-products" style="display: block;">
        <div style="margin-bottom: 2rem;">
            <button onclick="showAddProductForm()" class="btn-highlight" style="padding: 12px 24px;">+ Thêm sản phẩm mới</button>
        </div>

        <!-- Products List -->
        <div id="productsList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem;">
            <!-- Products will be loaded here -->
        </div>

        <!-- Add/Edit Product Form -->
        <div id="productForm" class="card" style="margin-top: 2rem; display: none;">
            <div class="card-content">
                <h3>Thêm/Sửa Sản Phẩm</h3>
                
                <div style="margin-bottom: 1rem;">
                    <label for="prodName">Tên sản phẩm</label>
                    <input type="text" id="prodName" placeholder="Ví dụ: Cà phê đen đá">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="prodPrice">Giá bán (đ)</label>
                    <input type="number" id="prodPrice" placeholder="25000" min="0">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="prodDesc">Mô tả</label>
                    <textarea id="prodDesc" placeholder="Mô tả chi tiết về sản phẩm..." style="width: 100%; height: 100px;"></textarea>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="prodImage">Hình ảnh</label>
                    <input type="file" id="prodImage" accept="image/*">
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button onclick="cancelProductForm()" class="btn-secondary" style="flex: 1;">Hủy</button>
                    <button onclick="saveProduct()" class="btn-highlight" style="flex: 1;">Lưu sản phẩm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- INGREDIENTS TAB -->
    <div id="tab-ingredients" style="display: none;">
        <div style="margin-bottom: 2rem;">
            <button onclick="showAddIngredientForm()" class="btn-highlight" style="padding: 12px 24px;">+ Thêm nguyên liệu</button>
        </div>

        <!-- Ingredients List -->
        <div id="ingredientsList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem;">
            <!-- Ingredients will be loaded here -->
        </div>

        <!-- Add/Edit Ingredient Form -->
        <div id="ingredientForm" class="card" style="margin-top: 2rem; display: none;">
            <div class="card-content">
                <h3>Thêm/Sửa Nguyên Liệu</h3>
                
                <div style="margin-bottom: 1rem;">
                    <label for="ingName">Tên nguyên liệu</label>
                    <input type="text" id="ingName" placeholder="Ví dụ: Cà phê Arabica">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="ingPrice">Giá mua (đ/kg)</label>
                    <input type="number" id="ingPrice" placeholder="50000" min="0">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="ingQuantity">Số lượng tồn (kg)</label>
                    <input type="number" id="ingQuantity" placeholder="10" min="0" step="0.1">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="ingUnit">Đơn vị tính</label>
                    <select id="ingUnit" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px;">
                        <option>kg</option>
                        <option>lít</option>
                        <option>gói</option>
                        <option>cái</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button onclick="cancelIngredientForm()" class="btn-secondary" style="flex: 1;">Hủy</button>
                    <button onclick="saveIngredient()" class="btn-highlight" style="flex: 1;">Lưu nguyên liệu</button>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', async () => {
        await loadProducts();
        await loadIngredients();
    });

    function switchTab(tabName) {
        document.querySelectorAll('[id^="tab-"][id$="-btn"]').forEach(btn => {
            btn.style.color = 'var(--text-muted)';
            btn.style.borderBottomColor = 'transparent';
        });
        document.querySelectorAll('[id^="tab-"][id$!="btn"]').forEach(el => el.style.display = 'none');

        document.getElementById('tab-' + tabName).style.display = 'block';
        document.getElementById('tab-' + tabName + '-btn').style.color = 'var(--phuclong-green)';
        document.getElementById('tab-' + tabName + '-btn').style.borderBottomColor = 'var(--phuclong-green)';
    }

    async function loadProducts() {
        try {
            const products = await api('GET', '/api/san-pham/nuoc-uong');
            const list = document.getElementById('productsList');
            list.innerHTML = '';

            products.forEach(prod => {
                const img = (prod.hinhAnh && prod.hinhAnh.length > 0) ? prod.hinhAnh[0] : '/uploads/default-drink.jpg';
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${img}" style="width: 100%; height: 180px; object-fit: cover; border-radius: 8px 8px 0 0;">
                    <div class="card-content">
                        <h4 style="margin-top: 0;">${prod.ten}</h4>
                        <p class="muted" style="font-size: 0.875rem;">${prod.moTa || ''}</p>
                        <p style="color: var(--phuclong-green); font-weight: 700; font-size: 1.2rem;">${formatCurrency(prod.gia)}</p>
                        <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                            <button onclick="editProduct('${prod.id}')" class="btn-secondary" style="flex: 1; padding: 6px;">Sửa</button>
                            <button onclick="deleteProduct('${prod.id}')" class="btn-secondary" style="flex: 1; padding: 6px; color: #e74c3c;">Xóa</button>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        } catch (e) {
            console.error('Error loading products:', e);
        }
    }

    async function loadIngredients() {
        try {
            const ingredients = await api('GET', '/api/san-pham/nguyen-lieu');
            const list = document.getElementById('ingredientsList');
            list.innerHTML = '';

            ingredients.forEach(ing => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-content">
                        <h4 style="margin-top: 0;">${ing.ten}</h4>
                        <p>Giá: <strong>${formatCurrency(ing.gia)}</strong>/kg</p>
                        <p>Tồn kho: <strong>${ing.soLuongTon}</strong> ${ing.donVi}</p>
                        <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                            <button onclick="editIngredient('${ing.id}')" class="btn-secondary" style="flex: 1; padding: 6px;">Sửa</button>
                            <button onclick="deleteIngredient('${ing.id}')" class="btn-secondary" style="flex: 1; padding: 6px; color: #e74c3c;">Xóa</button>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        } catch (e) {
            console.error('Error loading ingredients:', e);
        }
    }

    function showAddProductForm() {
        document.getElementById('productForm').style.display = 'block';
        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodDesc').value = '';
    }

    function cancelProductForm() {
        document.getElementById('productForm').style.display = 'none';
    }

    async function saveProduct() {
        const name = document.getElementById('prodName').value.trim();
        const price = parseFloat(document.getElementById('prodPrice').value);
        const desc = document.getElementById('prodDesc').value.trim();

        if (!name || !price) {
            alert('Vui lòng điền tên và giá');
            return;
        }

        try {
            await api('POST', '/api/san-pham/nuoc-uong', {
                ten: name,
                gia: price,
                moTa: desc
            });

            alert('Thêm sản phẩm thành công!');
            cancelProductForm();
            await loadProducts();
        } catch (e) {
            alert('Lỗi: ' + e.message);
        }
    }

    async function deleteProduct(productId) {
        if (!confirm('Bạn có chắc muốn xóa sản phẩm này?')) return;
        
        try {
            // Implementation would depend on DELETE endpoint availability
            alert('Tính năng xóa đang được cập nhật');
        } catch (e) {
            alert('Lỗi: ' + e.message);
        }
    }

    function showAddIngredientForm() {
        document.getElementById('ingredientForm').style.display = 'block';
        document.getElementById('ingName').value = '';
        document.getElementById('ingPrice').value = '';
        document.getElementById('ingQuantity').value = '';
    }

    function cancelIngredientForm() {
        document.getElementById('ingredientForm').style.display = 'none';
    }

    async function saveIngredient() {
        const name = document.getElementById('ingName').value.trim();
        const price = parseFloat(document.getElementById('ingPrice').value);

        if (!name || !price) {
            alert('Vui lòng điền tên và giá');
            return;
        }

        try {
            await api('POST', '/api/san-pham/nguyen-lieu', {
                ten: name,
                gia: price
            });

            alert('Thêm nguyên liệu thành công!');
            cancelIngredientForm();
            await loadIngredients();
        } catch (e) {
            alert('Lỗi: ' + e.message);
        }
    }

    async function deleteIngredient(ingredientId) {
        if (!confirm('Bạn có chắc muốn xóa nguyên liệu này?')) return;
        alert('Tính năng xóa đang được cập nhật');
    }

    function formatCurrency(value) {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(value || 0);
    }
</script>

</body>
</html>
