<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin Dashboard')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <h1 class="h4 mb-3">Admin Dashboard</h1>
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Khách hàng</div>
                    <div class="fs-3 fw-bold" th:text="${totalCustomers}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Sản phẩm</div>
                    <div class="fs-3 fw-bold" th:text="${totalProducts}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Đơn hàng</div>
                    <div class="fs-3 fw-bold" th:text="${totalOrders}">0</div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
