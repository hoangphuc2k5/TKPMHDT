<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng nhập')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5" style="max-width: 520px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">Đăng nhập</h1>

            <div th:if="${param.error}" class="alert alert-danger">Sai thông tin đăng nhập hoặc chưa kích hoạt OTP.</div>
            <div th:if="${param.logout}" class="alert alert-info">Bạn đã đăng xuất.</div>
            <div th:if="${param.verified}" class="alert alert-success">Xác thực OTP thành công. Bạn có thể đăng nhập.</div>

            <form th:action="@{/auth/login}" method="post" class="vstack gap-3">
                <div>
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" name="username" required>
                </div>
                <div>
                    <label class="form-label">Mật khẩu</label>
                    <input class="form-control" type="password" name="password" required>
                </div>
                <button class="btn btn-dark w-100" type="submit">Đăng nhập</button>
            </form>

            <div class="mt-3 small">
                Chưa có tài khoản?
                <a th:href="@{/auth/register}">Đăng ký</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
