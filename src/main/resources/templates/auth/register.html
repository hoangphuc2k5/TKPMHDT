<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng ký')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5" style="max-width: 620px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">Đăng ký khách hàng</h1>
            <p class="text-muted small mb-4">Sau khi đăng ký, hệ thống sẽ gửi OTP (email giả lập) để kích hoạt tài khoản.</p>

            <form th:object="${form}" th:action="@{/auth/register}" method="post" class="vstack gap-3">
                <div>
                    <label class="form-label">Họ tên</label>
                    <input class="form-control" th:field="*{hoTen}" placeholder="Nguyễn Văn A">
                    <div class="text-danger small" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}">err</div>
                </div>
                <div>
                    <label class="form-label">Email</label>
                    <input class="form-control" th:field="*{email}" placeholder="email@domain.com">
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">err</div>
                </div>
                <div>
                    <label class="form-label">Mật khẩu</label>
                    <input class="form-control" type="password" th:field="*{matKhau}" placeholder="******">
                    <div class="text-danger small" th:if="${#fields.hasErrors('matKhau')}" th:errors="*{matKhau}">err</div>
                </div>
                <button class="btn btn-dark" type="submit">Tạo tài khoản & gửi OTP</button>
            </form>

            <div class="mt-3 small">
                Đã có tài khoản?
                <a th:href="@{/auth/login}">Đăng nhập</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
