<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Xác thực OTP')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5" style="max-width: 620px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">Xác thực OTP</h1>
            <p class="text-muted small">
                OTP đã được gửi (giả lập) tới email:
                <b th:text="${email}">email</b>.
                Bạn có thể mở <a th:href="@{/auth/otp-inbox}">OTP Inbox</a> để xem OTP.
            </p>

            <form th:object="${otpForm}" th:action="@{/auth/verify-otp}" method="post" class="vstack gap-3">
                <input type="hidden" th:field="*{email}">
                <div>
                    <label class="form-label">Mã OTP (6 số)</label>
                    <input class="form-control" th:field="*{otp}" placeholder="123456" inputmode="numeric">
                    <div class="text-danger small" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}">err</div>
                </div>
                <button class="btn btn-dark" type="submit">Xác thực</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
