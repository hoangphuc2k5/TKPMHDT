<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng ký tài khoản - 4it2run')}"></head>
<body class="auth-page auth-page-no-decor">
<div class="auth-shell">
    <a th:href="@{/}" class="auth-brand" style="text-decoration: none; color: inherit; display: inline-flex; flex-direction: column; align-items: center; gap: 10px;" title="4it2run">
        <img th:src="@{/logo/TYPO_Logo-17.jpg}" alt="4it2run" class="auth-brand-logo" width="200" height="56" loading="eager" decoding="async">
        <span class="visually-hidden">4it2run</span>
    </a>
    <div class="auth-tabs">
        <a class="auth-tab" th:href="@{/login}">Đăng nhập</a>
        <a class="auth-tab active" th:href="@{/register}">Đăng ký</a>
    </div>
    <div class="section-card">
        <div style="margin-bottom: 1rem; text-align: center;">
            <h2 style="margin-bottom: 0.3rem;">Tạo tài khoản mới</h2>
            <p class="muted">Đăng ký để đặt món nhanh hơn.</p>
        </div>

        <form method="post" th:action="@{/api/nguoi-dung/dang-ky-khach-hang}" id="registerForm" style="display: none;">
            <!-- Form sẽ được xử lý bằng JavaScript -->
        </form>

        <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
            <!-- Họ và tên -->
            <div>
                <label for="fullName">Họ và tên</label>
                <input type="text" id="fullName" placeholder="Nhập họ và tên của bạn..." required>
            </div>

            <!-- Email -->
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <!-- Số điện thoại -->
            <div>
                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" placeholder="0123456789" required>
            </div>

            <!-- Tên đăng nhập -->
            <div>
                <label for="username">Tên tài khoản</label>
                <input type="text" id="username" placeholder="Chọn tên đăng nhập..." required>
            </div>

            <!-- Mật khẩu -->
            <div>
                <label for="password">Mật khẩu</label>
                <div class="password-field-wrap">
                    <input type="password" id="password" placeholder="Tối thiểu 6 ký tự: chữ hoa, chữ thường, số" required autocomplete="new-password">
                    <button type="button" class="password-toggle-btn" onclick="togglePassword('password', this)" aria-label="Hiện mật khẩu">Hiện</button>
                </div>
                <small class="muted" style="display: block; margin-top: 0.5rem;">
                    ✓ Ít nhất 6 ký tự &nbsp; ✓ Có chữ hoa, chữ thường và số &nbsp; ✓ Không bắt buộc ký tự đặc biệt
                </small>
            </div>

            <!-- Xác nhận mật khẩu -->
            <div>
                <label for="passwordConfirm">Xác nhận mật khẩu</label>
                <div class="password-field-wrap">
                    <input type="password" id="passwordConfirm" placeholder="Nhập lại mật khẩu..." required autocomplete="new-password">
                    <button type="button" class="password-toggle-btn" onclick="togglePassword('passwordConfirm', this)" aria-label="Hiện mật khẩu">Hiện</button>
                </div>
            </div>

            <!-- Checkbox đồng ý -->
            <div style="display: flex; align-items: flex-start; gap: 10px; margin-top: 0.5rem;">
                <input type="checkbox" id="agreeTerms" required style="margin-top: 3px;">
                <label for="agreeTerms" style="margin-bottom: 0;">
                    <span class="muted">Tôi đã đọc và đồng ý với </span>
                    <a href="#" style="color: var(--phuclong-green); text-decoration: none;">Điều khoản dịch vụ</a>
                    <span class="muted"> và </span>
                    <a href="#" style="color: var(--phuclong-green); text-decoration: none;">Chính sách bảo mật</a>
                </label>
            </div>
        </div>

        <button onclick="dkTaiKhoan()" class="btn-highlight" style="width: 100%; margin-top: 2rem; padding: 12px;">Đăng ký</button>

        <div style="margin-top: 1.2rem; text-align: center;">
            <p class="muted" style="font-size: 0.875rem;">Đã có tài khoản?
                <a th:href="@{/login}" style="color: var(--phuclong-green); text-decoration: none; font-weight: 600;">Đăng nhập</a>
            </p>
        </div>

        <div id="errorMsg" style="margin-top: 1.5rem; padding: 1rem; border-radius: 12px; background: #fee2e2; color: #991b1b; display: none;"></div>
        <div id="successMsg" style="margin-top: 1.5rem; padding: 1rem; border-radius: 12px; background: #dcfce7; color: #166534; display: none;"></div>
    </div>
</div>

<script th:inline="javascript">
    // Validation
    function validatePassword(password) {
        if (typeof isPasswordPolicyCompliant === 'function') {
            return isPasswordPolicyCompliant(password);
        }
        return password.length >= 6 && /[A-Z]/.test(password) && /[a-z]/.test(password) && /\d/.test(password);
    }

    function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    async function dkTaiKhoan() {
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('passwordConfirm').value;
        const agreeTerms = document.getElementById('agreeTerms').checked;

        // Validate
        if (!fullName || !email || !phone || !username || !password) {
            showError('Vui lòng điền đầy đủ thông tin');
            return;
        }

        if (!validateEmail(email)) {
            showError('Email không hợp lệ');
            return;
        }

        if (!validatePassword(password)) {
            showError(typeof PASSWORD_POLICY_MESSAGE_VI !== 'undefined' ? PASSWORD_POLICY_MESSAGE_VI : 'Mật khẩu không đủ điều kiện');
            return;
        }

        if (password !== passwordConfirm) {
            showError('Mật khẩu xác nhận không khớp');
            return;
        }

        if (!agreeTerms) {
            showError('Bạn phải đồng ý với điều khoản dịch vụ');
            return;
        }

        try {
            const response = await fetch('/api/auth/dang-ky', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tenDangNhap: username,
                    email: email,
                    matKhau: password,
                    hoTen: fullName
                })
            });

            if (response.ok) {
                showSuccess('Đăng ký thành công! Đang chuyển hướng...');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else if (response.status === 409) {
                showError('Tên đăng nhập hoặc email đã được sử dụng');
            } else {
                showError('Đăng ký thất bại. Vui lòng thử lại');
            }
        } catch (error) {
            showError('Lỗi: ' + error.message);
        }
    }

    function showError(message) {
        const errorEl = document.getElementById('errorMsg');
        errorEl.textContent = message;
        errorEl.style.display = 'block';
        document.getElementById('successMsg').style.display = 'none';
    }

    function showSuccess(message) {
        const successEl = document.getElementById('successMsg');
        successEl.textContent = message;
        successEl.style.display = 'block';
        document.getElementById('errorMsg').style.display = 'none';
    }

    // Validate on change
    document.getElementById('password').addEventListener('change', () => {
        const pwd = document.getElementById('password').value;
        const isValid = validatePassword(pwd);
        const btn = document.querySelector('button');
        if (isValid) {
            btn.style.opacity = '1';
        }
    });
</script>

</body>
</html>
