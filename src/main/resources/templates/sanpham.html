<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Thực đơn drink')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('products')}"></header>

<div class="container" style="padding-top:18px; padding-bottom:84px;">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:18px;">
        <div>
            <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-size:1.6rem;">🥤</span>
                <span class="brand-font" style="font-size:1.8rem;">DrinkHub</span>
            </div>
            <p class="muted" style="margin:10px 0 0; max-width:560px;">Thực đơn đồ uống tươi ngon, topping phong phú và đặt hàng nhanh chóng. Chọn sản phẩm và xem chi tiết ngay.</p>
        </div>
        <button class="btn-secondary" style="margin-top:0; padding:10px 14px;" onclick="timNuocUong()">Lọc</button>
    </div>

    <div id="productCount" class="muted" style="margin-bottom:16px;">0 sản phẩm</div>

    <form role="search" class="input-with-action" style="margin-bottom:10px;" autocomplete="on"
          onsubmit="event.preventDefault(); timNuocUong(); return false;">
        <input id="search-input" name="q" type="search" inputmode="search" enterkeyhint="search"
               placeholder="Tìm kiếm đồ uống..." style="padding-right:70px;"
               list="san-pham-search-datalist" autocomplete="on" autocapitalize="off" spellcheck="false"
               aria-label="Tìm kiếm đồ uống trong thực đơn">
        <button type="submit">Tìm</button>
    </form>
    <datalist id="san-pham-search-datalist"></datalist>

    <div id="category-tabs" class="category-tabs" style="margin-bottom:14px;"></div>

    <div id="products-grid" class="mobile-product-grid"></div>
    <div id="loading" style="display:none; text-align:center; padding:2rem;">Đang tải sản phẩm...</div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
let allProducts = [];
let activeCategory = 'Tất cả';
const DEFAULT_CATEGORIES = ['Tất cả', 'Trà sữa', 'Cà phê', 'Sinh tố', 'Topping'];

document.addEventListener("DOMContentLoaded", async () => {
    const searchEl = document.getElementById("search-input");
    if (searchEl) {
        searchEl.addEventListener("change", () => timNuocUong());
    }
    await dsNuocUong();
});

async function dsNuocUong() {
    showLoading(true);
    try {
        const res = await fetch("/api/san-pham/nuoc-uong");
        const data = await res.json();
        allProducts = data || [];
        fillSanPhamSearchDatalist();
        renderCategories();
        renderProducts(filterProducts(allProducts));
    } catch (e) {
        alert("Lỗi tải sản phẩm");
    } finally {
        showLoading(false);
    }
}

function fillSanPhamSearchDatalist() {
    const dl = document.getElementById("san-pham-search-datalist");
    if (!dl) return;
    dl.replaceChildren();
    const seen = new Set();
    (allProducts || []).forEach(p => {
        const t = (p.ten || "").trim();
        if (!t) return;
        const key = t.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        const opt = document.createElement("option");
        opt.value = t;
        dl.appendChild(opt);
    });
}

async function timNuocUong() {
    renderProducts(filterProducts(allProducts));
}

function escapeProductHtml(s) {
    if (s == null) return '';
    const d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
}

function renderProducts(products) {
    const grid = document.getElementById("products-grid");
    grid.innerHTML = "";

    if (!products || products.length === 0) {
        grid.innerHTML = "<p class='muted'>Không có sản phẩm phù hợp.</p>";
        return;
    }

    products.forEach(p => {
        const img = (p.hinhAnh && p.hinhAnh.length > 0)
            ? p.hinhAnh[0]
            : "/uploads/default-drink.jpg";
        const categoryChip = p.danhMuc ? `<span class="chip progress" style="font-size:0.72rem; padding:4px 8px;">${escapeProductHtml(p.danhMuc)}</span>` : '';
        const goc = Number(p.gia || 0);
        const sau = p.giaSauKhuyenMai != null ? Number(p.giaSauKhuyenMai) : goc;
        const showKm = p.dangKhuyenMai && sau < goc;
        const nhan = escapeProductHtml(p.nhanKhuyenMai || 'Khuyến mãi');
        const kmChip = showKm ? `<span class="chip pending" style="font-size:0.72rem; padding:4px 8px; background:#fff0f0; color:#b01030; border-color:#f5c2c7;">${nhan}</span>` : '';
        const priceBlock = showKm
            ? `<div style="margin-top:12px; display:flex; flex-wrap:wrap; align-items:center; gap:8px;">
                    <span style="text-decoration:line-through; color:#888; font-weight:500; font-size:0.95rem;">${formatPrice(goc)}</span>
                    <span style="color:var(--phuclong-green); font-weight:700;">${formatPrice(sau)}</span>
               </div>`
            : `<div style="margin-top:12px; color:var(--phuclong-green); font-weight:700;">${formatPrice(goc)}</div>`;

        grid.innerHTML += `
            <div class="mobile-product-card" onclick="goToDetail('${p.id}')" style="cursor:pointer; position:relative;">
                ${showKm ? `<div style="position:absolute; top:10px; left:10px; z-index:1;"><span class="chip pending" style="font-size:0.72rem; padding:5px 10px; background:#0C713D; color:#fff; border:none;">Giảm giá</span></div>` : ''}
                <img src="${img}" style="${showKm ? 'opacity:0.97;' : ''}">
                <div style="padding:14px 12px 16px;">
                    <div style="display:flex; justify-content:space-between; gap:8px; align-items:flex-start;">
                        <strong style="font-size:1rem; line-height:1.3;">${escapeProductHtml(p.ten)}</strong>
                        <span style="color:#cc3154; font-size:1.1rem;">♡</span>
                    </div>
                    <div style="margin:10px 0 8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                        ${categoryChip}
                        ${kmChip}
                        <span class="muted" style="font-size:0.78rem;">${escapeProductHtml((p.moTa || '').slice(0, 60))}${(p.moTa || '').length > 60 ? '...' : ''}</span>
                    </div>
                    ${priceBlock}
                </div>
            </div>`;
    });
    const countNode = document.getElementById("productCount");
    if (countNode) {
        countNode.textContent = `${products.length} sản phẩm`;
    }
}

function renderCategories() {
    const derived = new Set(DEFAULT_CATEGORIES);
    allProducts.forEach(p => {
        if (p.danhMuc) derived.add(p.danhMuc);
    });
    const tabs = Array.from(derived);
    const container = document.getElementById('category-tabs');
    container.innerHTML = tabs.map(cat => `
        <button class="category-tab ${activeCategory === cat ? 'active' : ''}" onclick="setCategory('${cat.replace(/'/g, "\\'")}')">${cat}</button>
    `).join('');
}

function setCategory(cat) {
    activeCategory = cat;
    renderCategories();
    renderProducts(filterProducts(allProducts));
}

function filterProducts(products) {
    const q = (document.getElementById("search-input").value || '').trim().toLowerCase();
    return (products || []).filter(p => {
        const matchText = !q || (p.ten || '').toLowerCase().includes(q) || (p.moTa || '').toLowerCase().includes(q);
        const matchCat = activeCategory === 'Tất cả' || !activeCategory || (p.danhMuc || '').toLowerCase() === activeCategory.toLowerCase();
        return matchText && matchCat;
    });
}

function goToDetail(id) {
    if (!id) {
        alert("Không tìm thấy ID sản phẩm");
        return;
    }

    window.location.href = `/ui/san-pham/chi-tiet?id=${id}`;
}

function formatPrice(price) {
    return new Intl.NumberFormat('vi-VN', {
        style: 'currency',
        currency: 'VND'
    }).format(price);
}

function showLoading(show) {
    document.getElementById("loading").style.display = show ? "block" : "none";
}
</script>

</body>
</html>
