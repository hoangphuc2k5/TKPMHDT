<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Thực đơn drink')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('products')}"></header>

<div class="container" style="padding-top:18px; padding-bottom:84px; max-width:760px;">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:18px;">
        <div>
            <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-size:1.6rem;">🥤</span>
                <span class="brand-font" style="font-size:1.8rem;">DrinkHub</span>
            </div>
            <p class="muted" style="margin:10px 0 0; max-width:560px;">Thực đơn đồ uống tươi ngon, topping phong phú và đặt hàng nhanh chóng. Chọn sản phẩm và xem chi tiết ngay.</p>
        </div>
        <button class="btn-secondary" style="margin-top:0; padding:10px 14px;" onclick="timNuocUong()">Lọc</button>
    </div>

    <div id="productCount" class="muted" style="margin-bottom:16px;">0 sản phẩm</div>

    <div class="input-with-action" style="margin-bottom:10px;">
        <input id="search-input" type="text" placeholder="Tìm kiếm đồ uống..." style="padding-right:70px;">
        <button type="button" onclick="timNuocUong()">Tìm</button>
    </div>

    <div id="category-tabs" class="category-tabs" style="margin-bottom:14px;"></div>

    <div id="products-grid" class="mobile-product-grid"></div>
    <div id="loading" style="display:none; text-align:center; padding:2rem;">Đang tải sản phẩm...</div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
let allProducts = [];
let activeCategory = 'Tất cả';
const DEFAULT_CATEGORIES = ['Tất cả', 'Trà sữa', 'Cà phê', 'Sinh tố', 'Topping'];

document.addEventListener("DOMContentLoaded", async () => {
    await dsNuocUong();
});

async function dsNuocUong() {
    showLoading(true);
    try {
        const res = await fetch("/api/san-pham/nuoc-uong");
        const data = await res.json();
        allProducts = data || [];
        renderCategories();
        renderProducts(filterProducts(allProducts));
    } catch (e) {
        alert("Lỗi tải sản phẩm");
    } finally {
        showLoading(false);
    }
}

async function timNuocUong() {
    renderProducts(filterProducts(allProducts));
}

function renderProducts(products) {
    const grid = document.getElementById("products-grid");
    grid.innerHTML = "";

    if (!products || products.length === 0) {
        grid.innerHTML = "<p class='muted'>Không có sản phẩm phù hợp.</p>";
        return;
    }

    products.forEach(p => {
        const img = (p.hinhAnh && p.hinhAnh.length > 0)
            ? p.hinhAnh[0]
            : "/uploads/default-drink.jpg";
        const categoryChip = p.danhMuc ? `<span class="chip progress" style="font-size:0.72rem; padding:4px 8px;">${p.danhMuc}</span>` : '';

        grid.innerHTML += `
            <div class="mobile-product-card" onclick="goToDetail('${p.id}')" style="cursor:pointer;">
                <img src="${img}">
                <div style="padding:14px 12px 16px;">
                    <div style="display:flex; justify-content:space-between; gap:8px; align-items:flex-start;">
                        <strong style="font-size:1rem; line-height:1.3;">${p.ten}</strong>
                        <span style="color:#cc3154; font-size:1.1rem;">♡</span>
                    </div>
                    <div style="margin:10px 0 8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                        ${categoryChip}
                        <span class="muted" style="font-size:0.78rem;">${(p.moTa || '').slice(0, 60)}${(p.moTa || '').length > 60 ? '...' : ''}</span>
                    </div>
                    <div style="margin-top:12px; color:var(--phuclong-green); font-weight:700;">${formatPrice(p.gia)}</div>
                </div>
            </div>`;
    });
    const countNode = document.getElementById("productCount");
    if (countNode) {
        countNode.textContent = `${products.length} sản phẩm`;
    }
}

function renderCategories() {
    const derived = new Set(DEFAULT_CATEGORIES);
    allProducts.forEach(p => {
        if (p.danhMuc) derived.add(p.danhMuc);
    });
    const tabs = Array.from(derived);
    const container = document.getElementById('category-tabs');
    container.innerHTML = tabs.map(cat => `
        <button class="category-tab ${activeCategory === cat ? 'active' : ''}" onclick="setCategory('${cat.replace(/'/g, "\\'")}')">${cat}</button>
    `).join('');
}

function setCategory(cat) {
    activeCategory = cat;
    renderCategories();
    renderProducts(filterProducts(allProducts));
}

function filterProducts(products) {
    const q = (document.getElementById("search-input").value || '').trim().toLowerCase();
    return (products || []).filter(p => {
        const matchText = !q || (p.ten || '').toLowerCase().includes(q) || (p.moTa || '').toLowerCase().includes(q);
        const matchCat = activeCategory === 'Tất cả' || !activeCategory || (p.danhMuc || '').toLowerCase() === activeCategory.toLowerCase();
        return matchText && matchCat;
    });
}

function goToDetail(id) {
    if (!id) {
        alert("Không tìm thấy ID sản phẩm");
        return;
    }

    window.location.href = `/ui/san-pham/chi-tiet?id=${id}`;
}

function formatPrice(price) {
    return new Intl.NumberFormat('vi-VN', {
        style: 'currency',
        currency: 'VND'
    }).format(price);
}

function showLoading(show) {
    document.getElementById("loading").style.display = show ? "block" : "none";
}
</script>

</body>
</html>
