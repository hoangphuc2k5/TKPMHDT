<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Thực đơn drink')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('products')}"></header>

<div class="container">
    <div style="margin-bottom: 3rem; text-align: center;">
        <h1 class="brand-font">Danh Mục Sản Phẩm</h1>
        <p class="muted">Khám phá các loại đồ uống tuyệt vời được pha chế theo sở thích của bạn.</p>
    </div>

    <!-- Search -->
    <div class="card" style="margin-bottom: 2rem;">
        <div class="card-content" style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 250px;">
                <label>Tìm kiếm món</label>
                <input id="search-input" type="text" placeholder="Nhập tên đồ uống..." style="width: 100%;">
            </div>

            <button onclick="timNuocUong()" class="btn-highlight">Tìm kiếm</button>
            <button onclick="dsNuocUong()" class="btn-secondary">Xem tất cả</button>
        </div>
    </div>

    <!-- Products -->
    <div id="products-grid"
         style="display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap:2rem;">
    </div>

    <div id="loading" style="display:none; text-align:center; padding:2rem;">
        Đang tải sản phẩm...
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
document.addEventListener("DOMContentLoaded", dsNuocUong);

async function dsNuocUong() {
    showLoading(true);
    try {
        const res = await fetch("/api/san-pham/nuoc-uong");
        const data = await res.json();
        renderProducts(data);
    } catch (e) {
        alert("Lỗi tải sản phẩm");
    } finally {
        showLoading(false);
    }
}

async function timNuocUong() {
    const ten = document.getElementById("search-input").value;
    showLoading(true);

    try {
        const res = await fetch("/api/san-pham/nuoc-uong/tim?ten=" + encodeURIComponent(ten));
        const data = await res.json();
        renderProducts(data);
    } catch (e) {
        alert("Lỗi tìm kiếm");
    } finally {
        showLoading(false);
    }
}

    function renderProducts(products) {
        const grid = document.getElementById("products-grid");
        grid.innerHTML = "";
        
        if (!products || products.length === 0) {
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem;">Không tìm thấy món nào phù hợp.</div>';
            return;
        }

        products.forEach(p => {
            const img = (p.hinhAnh && p.hinhAnh.length > 0) ? p.hinhAnh[0] : '/uploads/default-drink.jpg';
            const card = `
                <div class="card product-card" style="display: flex; flex-direction: column; overflow: hidden; height: 100%;">
                    <div style="height: 220px; overflow: hidden; position: relative;">
                        <img src="${img}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s;" 
                             onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
                        <div style="position: absolute; top: 10px; right: 10px; background: var(--phuclong-gold); color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem;">
                            ${formatPrice(p.gia)}
                        </div>
                    </div>
                    <div class="card-content" style="flex: 1; display: flex; flex-direction: column;">
                        <h3 style="margin-top: 0; margin-bottom: 0.5rem; color: var(--phuclong-green);">${p.ten}</h3>
                        <p class="muted" style="font-size: 0.85rem; margin-bottom: 1.5rem; flex: 1;">${p.moTa || 'Hương vị tuyệt hảo từ drink, mang lại cảm giác sảng khoái.'}</p>
                        <div style="display: flex; gap: 0.5rem; width: 100%; margin-top: auto;">
                            <button data-id="${p.id}" data-name="${p.ten}" onclick="openCustomizeModal(this.dataset.id, this.dataset.name)" class="btn-highlight" style="flex: 1; padding: 0.9rem;">
                                Thêm vào giỏ
                            </button>
                            <button data-id="${p.id}" onclick="buyNow(this.dataset.id)" class="btn-secondary" style="flex: 1; padding: 0.9rem;">
                                Mua ngay
                            </button>
                        </div>
                    </div>
                </div>
            `;
            grid.innerHTML += card;
        });
    }

    if (!products || products.length === 0) {
        grid.innerHTML = "<p>Không có sản phẩm nào.</p>";
        return;
    }

    products.forEach(p => {
        const img = (p.hinhAnh && p.hinhAnh.length > 0)
            ? p.hinhAnh[0]
            : "/uploads/default-drink.jpg";

        grid.innerHTML += `
            <div class="card product-card" style="cursor:pointer"
                 onclick="goToDetail('${p.id}')">

                <div style="height:220px; overflow:hidden;">
                    <img src="${img}" 
                         style="width:100%; height:100%; object-fit:cover;">
                </div>

                <div class="card-content">
                    <h3>${p.ten}</h3>
                    <p>${p.moTa || ""}</p>
                    <h4 style="color:green">
                        ${formatPrice(p.gia)}
                    </h4>

                    <button onclick="event.stopPropagation(); goToDetail('${p.id}')"
                            class="btn-highlight"
                            style="width:100%;">
                        Xem chi tiết
                    </button>
                </div>
            </div>
        `;
    });
}

function goToDetail(id) {
    if (!id) {
        alert("Không tìm thấy ID sản phẩm");
        return;
    }

    function buyNow(productId) {
        const params = new URLSearchParams({
            buyNow: 'true',
            productId: productId,
            quantity: '1',
            mucDuong: '100',
            mucDa: '100',
            ghiChu: ''
        });
        window.location.href = '/ui/don-hang?' + params.toString();
    }
</script>

</body>
</html>
