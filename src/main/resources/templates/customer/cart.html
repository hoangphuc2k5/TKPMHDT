<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Giỏ hàng')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 m-0">Giỏ hàng</h1>
        <a class="btn btn-sm btn-dark" th:href="@{/customer/orders/checkout(khachHangId=${khachHangId})}">Checkout</a>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Sản phẩm</th>
                            <th class="text-end">Đơn giá</th>
                            <th class="text-end">Số lượng</th>
                            <th class="text-end">Thành tiền</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(cart.items)}">
                            <td colspan="5" class="text-center text-muted py-4">Giỏ hàng trống.</td>
                        </tr>
                        <tr th:each="i : ${cart.items}">
                            <td>
                                <div class="fw-semibold" th:text="${i.tenSanPham}">Tên</div>
                                <div class="small text-muted">#<span th:text="${i.sanPhamId}">id</span></div>
                            </td>
                            <td class="text-end" th:text="${i.donGia}">0</td>
                            <td class="text-end" th:text="${i.soLuong}">1</td>
                            <td class="text-end fw-semibold" th:text="${i.thanhTien}">0</td>
                            <td class="text-end">
                                <form th:action="@{/customer/cart/remove/{id}(id=${i.id},khachHangId=${khachHangId})}" method="post">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <form class="mt-3" th:action="@{/customer/cart/clear(khachHangId=${khachHangId})}" method="post">
                <button class="btn btn-sm btn-outline-dark" type="submit">Xóa hết</button>
            </form>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h6">Thêm nhanh</h2>
                    <form th:object="${addForm}" th:action="@{/customer/cart/add(khachHangId=${khachHangId})}" method="post" class="vstack gap-2">
                        <div>
                            <label class="form-label small">Sản phẩm ID</label>
                            <input class="form-control form-control-sm" th:field="*{sanPhamId}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('sanPhamId')}" th:errors="*{sanPhamId}">err</div>
                        </div>
                        <div>
                            <label class="form-label small">Số lượng</label>
                            <input class="form-control form-control-sm" th:field="*{soLuong}" value="1" min="1" type="number">
                            <div class="text-danger small" th:if="${#fields.hasErrors('soLuong')}" th:errors="*{soLuong}">err</div>
                        </div>
                        <button class="btn btn-sm btn-dark" type="submit">Thêm</button>
                    </form>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <div class="text-muted">Tổng</div>
                        <div class="fw-bold" th:text="${cart.tongTien}">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
