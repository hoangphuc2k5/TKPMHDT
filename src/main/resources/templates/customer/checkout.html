<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Checkout')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5" style="max-width: 760px;">
    <h1 class="h4 mb-3">Checkout (Demo)</h1>
    <div class="alert alert-info small">
        Đây là form demo tạo đơn trực tiếp. Để tạo đơn từ giỏ hàng, service có thể chuyển đổi `ChiTietGioHang` → `ChiTietDonHang`.
    </div>

    <form th:object="${form}" th:action="@{/customer/orders/checkout}" method="post" class="card shadow-sm">
        <div class="card-body p-4 vstack gap-3">
            <input type="hidden" th:field="*{khachHangId}">

            <div>
                <label class="form-label">Địa chỉ giao hàng</label>
                <input class="form-control" th:field="*{diaChiGiaoHang}" placeholder="Số nhà, đường, phường/xã...">
                <div class="text-danger small" th:if="${#fields.hasErrors('diaChiGiaoHang')}" th:errors="*{diaChiGiaoHang}">err</div>
            </div>

            <div>
                <label class="form-label">Mã giảm giá (tuỳ chọn)</label>
                <input class="form-control" th:field="*{maGiamGia}" placeholder="VD: SALE10">
            </div>

            <div>
                <label class="form-label">Phương thức thanh toán</label>
                <select class="form-select" th:field="*{phuongThucThanhToan}">
                    <option th:each="m : ${paymentMethods}" th:value="${m}" th:text="${m}">COD</option>
                </select>
            </div>

            <div class="border rounded p-3 bg-light">
                <div class="fw-semibold mb-2">Items (tối thiểu 1)</div>
                <div class="row g-2">
                    <div class="col-md-8">
                        <label class="form-label small">Sản phẩm ID</label>
                        <input class="form-control" name="items[0].sanPhamId" placeholder="VD: 1">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small">Số lượng</label>
                        <input class="form-control" name="items[0].soLuong" type="number" min="1" value="1">
                    </div>
                </div>
                <div class="text-muted small mt-2">Tùy chỉnh (đường/đá/topping) sẽ mở rộng ở UI nâng cao.</div>
            </div>

            <button class="btn btn-dark" type="submit">Tạo đơn</button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
