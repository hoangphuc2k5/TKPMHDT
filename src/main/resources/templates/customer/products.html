<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Menu')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 m-0">Menu</h1>
        <a class="btn btn-sm btn-dark" th:href="@{/customer/cart(khachHangId=1)}">Giỏ hàng</a>
    </div>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="p : ${products}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <h2 class="h6 mb-1" th:text="${p.ten}">Tên</h2>
                        <span class="badge bg-secondary" th:text="${p.loai}">type</span>
                    </div>
                    <p class="text-muted small mb-3" th:text="${p.moTa}">Mô tả</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="fw-semibold" th:text="${p.giaBan}">0</div>
                        <a class="btn btn-sm btn-outline-dark" th:href="@{/customer/products/{id}(id=${p.id})}">Chi tiết</a>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(products)}" class="text-muted">Chưa có sản phẩm.</div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
