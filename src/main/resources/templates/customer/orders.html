<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đơn hàng')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 m-0">Đơn hàng</h1>
        <a class="btn btn-sm btn-dark" th:href="@{/customer/orders/checkout(khachHangId=${khachHangId})}">Tạo đơn</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Mã</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Tổng thanh toán</th>
                    <th class="text-end">Ngày tạo</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="5" class="text-center text-muted py-4">Chưa có đơn hàng.</td>
                </tr>
                <tr th:each="o : ${orders}">
                    <td class="fw-semibold" th:text="${o.maDonHang}">DH-XXX</td>
                    <td><span class="badge bg-secondary" th:text="${o.trangThai}">status</span></td>
                    <td class="text-end fw-bold" th:text="${o.tongThanhToan}">0</td>
                    <td class="text-end text-muted small" th:text="${o.createdAt}">time</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-dark" th:href="@{/customer/orders/{id}(id=${o.id})}">Chi tiết</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
