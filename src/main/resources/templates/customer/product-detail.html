<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Chi tiết sản phẩm')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5" th:if="${product != null}">
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h1 class="h4 mb-1" th:text="${product.ten}">Tên</h1>
                            <div class="text-muted small" th:text="${product.loai}">type</div>
                        </div>
                        <div class="fw-bold fs-5" th:text="${product.giaBan}">0</div>
                    </div>
                    <hr>
                    <p class="mb-0" th:text="${product.moTa}">Mô tả</p>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="h6">Thêm vào giỏ</h2>
                    <form th:action="@{/customer/cart/add(khachHangId=1)}" method="post" class="vstack gap-3">
                        <input type="hidden" name="sanPhamId" th:value="${product.id}">
                        <div>
                            <label class="form-label">Số lượng</label>
                            <input class="form-control" type="number" name="soLuong" value="1" min="1">
                        </div>
                        <button class="btn btn-dark" type="submit">Thêm vào giỏ</button>
                        <a class="btn btn-outline-dark" th:href="@{/customer/products}">Quay lại menu</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
