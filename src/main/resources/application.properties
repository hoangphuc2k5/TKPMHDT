spring.application.name=nuocuong

# =========================
# SQL Server Datasource
# =========================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TKPMHDT;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
# Hibernate 6: SQL Server dialect tự nhận theo driver; chỉ set khi cần ép cứng
# spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# =========================
# Thymeleaf
# =========================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# =========================
# OTP Email (giả lập)
# =========================
# Dự án dùng "email giả lập" (không cần SMTP thật). Các config dưới chỉ để đúng yêu cầu starter-mail.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=fake
spring.mail.password=fake
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.otp.length=6
app.otp.ttl-seconds=300
app.otp.from=no-reply@nuocuong.local
